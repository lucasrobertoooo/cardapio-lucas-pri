<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cardápio Lucas e Pri</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" id="touch-icon" href="icons/verde-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cardápio">
<meta name="theme-color" content="#F0F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1612" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Layout: coluna única de até 900px, placar fixo no topo da aba Hoje, navegação fixa embaixo (uso com uma mão, no celular, no mercado).
   Identidade: mercado + panela. Espinafre = ação concluída, cobalto = Lucas, framboesa = Pri. */
:root{
  --bg:#F4F6F3; --surface:#FFFFFF; --surface2:#EDF1EC; --ink:#14231B; --ink2:#4F6358; --line:#D2DED3;
  --leaf:#1E7B4E; --leaf-ink:#FFFFFF; --leaf-soft:#D9EEE2;
  --lucas:#2A55D6; --lucas-soft:#E1E8FB; --pri:#BC2B6A; --pri-soft:#F8DEEA;
  --warn:#9A5B07; --warn-soft:#FBEBCF; --ill:#E7EEE4;
  --f-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:16px; --shadow:none;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1310; --surface:#141D18; --surface2:#1C2721; --ink:#E7F0E9; --ink2:#A7B8AD; --line:#2A3B31;
  --leaf:#4DC78C; --leaf-ink:#07140D; --leaf-soft:#1B3A2A;
  --lucas:#8FADFF; --lucas-soft:#182038; --pri:#F592BE; --pri-soft:#2C1A24;
  --warn:#F0B35A; --warn-soft:#3A2B10; --ill:#1C2A22; --shadow:none;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1310; --surface:#141D18; --surface2:#1C2721; --ink:#E7F0E9; --ink2:#A7B8AD; --line:#2A3B31;
  --leaf:#4DC78C; --leaf-ink:#07140D; --leaf-soft:#1B3A2A;
  --lucas:#8FADFF; --lucas-soft:#182038; --pri:#F592BE; --pri-soft:#2C1A24;
  --warn:#F0B35A; --warn-soft:#3A2B10; --ill:#1C2A22; --shadow:none;
  color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f-body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:env(safe-area-inset-top,0px) calc(96px + env(safe-area-inset-bottom,0px));font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:900px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--f-body);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-family:var(--f-display)}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.hdr{padding:14px 0 10px}
.hdr h1{font-size:30px;line-height:1.1;font-weight:700;margin-top:2px}
.hdr .eyebrow{margin:0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:baseline}
.dot.L{background:var(--lucas)}.dot.P{background:var(--pri)}

/* navegação */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.nav-in{display:flex;width:100%;max-width:900px;gap:2px}
.nav button{position:relative;flex:1;min-width:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;color:var(--ink2);font-size:11px;font-weight:500}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--leaf);background:var(--leaf-soft)}

/* componentes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.sub{color:var(--ink2);font-size:13px}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.today::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--leaf);margin-left:6px;vertical-align:middle}
.day-chip{display:flex;flex-direction:column;align-items:center;min-width:56px;padding:7px 10px;line-height:1.15;gap:1px}
.day-chip b{font-size:15px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:13px}
.btn.primary{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}
.btn.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.btn.small{padding:6px 10px;font-size:12px}
.link{border:0;background:none;color:var(--leaf);font-weight:600;padding:0;font-size:13px}

/* placar: fino e fixo no topo */
.score{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 -16px 12px;padding:8px 16px;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px;min-width:0}
.sc .nm{font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.sc .nm .dot{margin:0}.sc .ok{margin-left:auto;color:var(--leaf);font-size:11px}
.sc .big{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.1}
.sc .big small{font-size:13px;font-weight:500;color:var(--ink2);font-family:var(--f-body);margin-left:2px}
.bar{height:6px;border-radius:99px;background:var(--surface2);position:relative;overflow:hidden;margin:5px 0 4px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:99px;display:block}
.bar .plan{background:color-mix(in srgb,var(--c) 25%,transparent)}
.bar .done{background:var(--c)}
.sc.L{--c:var(--lucas)}.sc.P{--c:var(--pri)}
.sc .st{font-size:11.5px;color:var(--ink2)}
.tip{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:500}
.days .day-chip{min-width:46px;padding:6px 8px}

/* cartão de refeição: a próxima aberta, as outras numa linha */
.ill{background:var(--ill);border-radius:12px;aspect-ratio:3/2;align-self:start;overflow:hidden}
.ill svg{display:block;width:100%;height:100%}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.slot{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;scroll-margin-top:124px}
.slot-row{display:grid;grid-template-columns:56px 1fr auto 18px;gap:12px;align-items:center;width:100%;border:0;background:none;padding:10px 12px;text-align:left;color:var(--ink)}
.slot-row .mini{width:56px;height:42px;border-radius:10px;overflow:hidden;background:var(--ill)}
.sr-tx{display:flex;flex-direction:column;min-width:0}.sr-tx b{font-size:15px;line-height:1.25}
.sr-tx .sub{font-size:12px}
.slot .chev{width:18px;height:18px;stroke:var(--ink2);fill:none;stroke-width:2}
.slot.done .sr-tx b{color:var(--ink2)}
.dots{display:flex;gap:4px}
.eat-dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line)}
.eat-dot.L.on{background:var(--lucas);border-color:var(--lucas)}.eat-dot.P.on{background:var(--pri);border-color:var(--pri)}
.hero{position:relative;display:block;width:100%;border:0;padding:0;background:var(--ill);aspect-ratio:2/1;overflow:hidden}
.hero img,.hero svg{width:100%;height:100%;object-fit:cover;display:block}
.hero-tag{position:absolute;left:12px;bottom:10px;background:rgba(10,18,14,.72);color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:8px;padding:4px 8px}
.hero .chev{position:absolute;right:10px;top:10px;width:30px;height:30px;padding:6px;border-radius:50%;background:rgba(10,18,14,.6);stroke:#fff;transform:rotate(180deg)}
.slot.now{border-color:var(--leaf);box-shadow:0 0 0 1px var(--leaf)}
.slot.now .hero-tag{background:var(--leaf);color:var(--leaf-ink)}
.slot-b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px}
.slot-b h3{font-size:19px;line-height:1.2}
.slot-b>.sub{margin-top:-10px}
.eats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.eat{display:flex;align-items:center;gap:8px;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-weight:600;font-size:14px;cursor:pointer}
.eat input{position:absolute;opacity:0;pointer-events:none}
.eat .box{width:24px;height:24px;border-radius:50%;margin:0}
.eat.L{color:var(--lucas)}.eat.P{color:var(--pri)}
.eat.L.on{background:var(--lucas-soft);border-color:transparent}.eat.P.on{background:var(--pri-soft);border-color:transparent}
.eat.L input:checked+.box{background:var(--lucas);border-color:var(--lucas)}.eat.P input:checked+.box{background:var(--pri);border-color:var(--pri)}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--ink2);display:grid;place-items:center;background:var(--surface);flex:0 0 auto}
.box svg{width:16px;height:16px;stroke:var(--leaf-ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.eat .box svg{stroke:#fff}
input:checked + .box{background:var(--leaf);border-color:var(--leaf)}
input:checked + .box svg{opacity:1}
input:focus-visible + .box{outline:2px solid var(--leaf);outline-offset:2px}
.qtab{width:100%;border-collapse:collapse;font-size:14px}
.qtab th,.qtab td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.qtab thead th{font-size:12px;font-weight:700;padding-top:0}
.qtab thead th.L,.qtab td:nth-child(2){padding-left:8px}
.qtab th.L{color:var(--lucas)}.qtab th.P{color:var(--pri)}
.qtab thead th:first-child .sub{font-size:11px;font-weight:500}
.qtab td{width:31%}
.qtab td b{font-weight:700;font-size:15px}.qtab td small{display:block;font-size:11.5px;color:var(--ink2);line-height:1.25}
.qtab td.none{color:var(--ink2)}
.qtab tbody th button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:6px 10px;min-height:34px;text-align:left;font-weight:600;font-size:13.5px;line-height:1.2;color:var(--ink)}
.qtab tbody th button span{color:var(--leaf);font-size:13px}
.qtab tbody th button:active{transform:scale(.97)}
.qtab tbody th{vertical-align:middle}
.qtab tr.add th{border-bottom:0}.qtab tr.add button{color:var(--leaf);font-weight:700;background:none;border-style:dashed}
.qtab tfoot th,.qtab tfoot td{border-bottom:0;font-size:12.5px;color:var(--ink2);padding-top:4px;padding-bottom:0}
.qtab tfoot td{font-weight:700;color:var(--ink)}
.qtab tfoot tr:first-child th,.qtab tfoot tr:first-child td{border-top:1px solid var(--line);padding-top:8px}
.slot-actions{display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap}
.alts{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.alt{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;background:var(--surface2);border-radius:12px;padding:8px}
.alt .mini{width:56px;height:38px;border-radius:8px;overflow:hidden;background:var(--ill)}
.alt .mini svg{width:100%;height:100%;display:block}
.alt-tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.alt-tx b{font-size:14px;line-height:1.25}
.alt-tx .L{color:var(--lucas);white-space:nowrap}.alt-tx .P{color:var(--pri);white-space:nowrap}

/* extras */
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 6px 6px 12px;font-size:13px}
.pill b{font-weight:700}
.pill .pm{border:0;width:26px;height:26px;border-radius:50%;background:var(--surface2);font-weight:700;line-height:1}
.pill .pm.add{background:var(--leaf);color:var(--leaf-ink)}
.pill .ct{min-width:14px;text-align:center;font-weight:700}

/* semana */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.stat.L{background:var(--lucas-soft)}.stat.P{background:var(--pri-soft)}
.stat .nm{font-size:12px;font-weight:700}.stat b{font-family:var(--f-display);font-size:26px;line-height:1.15}
.stat .sub{font-size:12px}
.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.dayc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 6px;display:flex;flex-direction:column;gap:6px}
.dayc.is-today{border-color:var(--leaf);box-shadow:0 0 0 1px var(--leaf)}
.dayc.past{opacity:.7}
.dayc .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dh{display:flex;align-items:baseline;gap:8px;border:0;background:none;padding:0;color:var(--ink);text-align:left}
.dayc h3{font-size:17px}
.dayc .tag{color:var(--leaf)}
.marks{display:flex;gap:6px;flex-wrap:wrap}
.mark{border:0;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;background:var(--surface2);color:var(--ink)}
.mark.prep{background:var(--leaf-soft);color:var(--leaf)}.mark.warn{background:var(--warn-soft);color:var(--warn)}
.dayc ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.dayc li+li{border-top:1px solid var(--line)}
.dayc li button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:7px 0;text-align:left;color:var(--ink);font-size:13.5px;min-height:44px}
.dayc li .sl{width:58px;flex:0 0 auto;font-size:11px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.dayc li .mini{width:40px;height:28px;border-radius:6px;overflow:hidden;background:var(--ill);flex:0 0 auto}
.dayc li .mini svg{width:100%;height:100%;display:block}
.wn{flex:1;min-width:0}
.tots{display:flex;gap:6px;flex-wrap:wrap}
.tot{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px}
.tot.L{background:var(--lucas-soft);color:var(--lucas)}.tot.P{background:var(--pri-soft);color:var(--pri)}

/* compras */
.meter{height:10px;border-radius:99px;background:var(--surface2);position:relative;overflow:hidden;margin:8px 0 4px}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--leaf);border-radius:99px}
.meter.over i{background:var(--warn)}
.meter u{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.6}
.aisle h3{font-size:15px;margin:6px 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:start;padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer;min-height:54px}
.item:last-child{border-bottom:0}
.item input{position:absolute;opacity:0;pointer-events:none}
.item .nm{font-weight:600;font-size:15px}
.item .qt{font-weight:700;text-align:right;font-size:14px;max-width:46vw}
.item .meta{grid-column:2/4;font-size:12px;color:var(--ink2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item.done .nm,.item.done .qt{text-decoration:line-through;opacity:.5}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mrow{display:flex;border-bottom:1px solid var(--line)}.mrow .item{flex:1;min-width:0;border-bottom:0}
.mrow .rm{flex:none;width:48px;border:0;background:none;color:var(--ink2);font-size:22px;cursor:pointer}
.man-add{display:flex;gap:8px;padding:10px 12px}.man-add .in-text{flex:1}.man-add .btn{flex:none}

/* receitas */
.rec-b{padding:14px;display:flex;flex-direction:column;gap:14px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.col{border-radius:12px;padding:10px 12px}
.col.L{background:var(--lucas-soft)}.col.P{background:var(--pri-soft)}
.col h4{margin:0 0 6px;font:700 13px var(--f-display)}
.col.L h4{color:var(--lucas)}.col.P h4{color:var(--pri)}
.col ul{margin:0;padding-left:16px;font-size:13px}
.col .tt{margin-top:8px;font-size:12px;font-weight:700}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:s}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;padding:8px 10px;border-radius:10px;background:var(--surface2);cursor:pointer;counter-increment:s}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:13px}
.steps li.done{opacity:.5}.steps li.done span{text-decoration:line-through}
.steps li.done::before{background:var(--leaf);color:var(--leaf-ink)}
.note{background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:13px}
.note b{font-weight:700}
.where{font-size:12px;color:var(--ink2)}

/* preparo */
.sess{padding:14px}
.sess>summary{list-style:none;cursor:pointer}.sess>summary::-webkit-details-marker{display:none}
details.sess[open]>summary{margin-bottom:12px}
.sess-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.sess-h h2{font-size:20px}
.sess .pbar{height:6px;flex:none;margin-top:8px}
.buy{border:0;border-radius:12px;padding:10px 12px;text-align:left;font-size:13px;font-weight:600;background:var(--leaf-soft);color:var(--leaf)}
.buy.warn{background:var(--warn-soft);color:var(--warn)}
.task{display:grid;grid-template-columns:1fr auto;gap:8px 10px;padding:12px;border-bottom:1px solid var(--line);align-items:start}
.task:last-child{border-bottom:0}
.tk{display:flex;gap:12px;align-items:flex-start;cursor:pointer;min-width:0}
.tk input{position:absolute;opacity:0;pointer-events:none}
.tk-tx{display:flex;flex-direction:column;min-width:0}
.tk .when{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.tk .nm{font-weight:700;font-size:15px}
.task.done .nm{text-decoration:line-through;opacity:.5}
.timer{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;min-height:36px;font-variant-numeric:tabular-nums}
.timer.run{background:var(--leaf);border-color:var(--leaf);color:var(--leaf-ink)}
.potes,.how{grid-column:1/-1;margin:0 0 0 38px}
.potes{list-style:none;padding:0;font-size:13px;border-radius:10px;background:var(--surface2);padding:4px 10px}
.potes li{display:grid;grid-template-columns:1fr 64px 64px;gap:6px;padding:4px 0}
.potes li+li{border-top:1px solid var(--line)}
.potes .ph{font-size:11px;font-weight:700;color:var(--ink2)}
.potes .L{color:var(--lucas);text-align:right;font-weight:600}.potes .P{color:var(--pri);text-align:right;font-weight:600}
.how summary{font-size:13px;font-weight:600;color:var(--leaf);cursor:pointer}
.how p{margin:6px 0 0;font-size:13px;color:var(--ink2)}

/* ajustes */
.fld{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.fld:last-child{border-bottom:0}

function applyUser(){

function fmt(n,d){return Number(n).toLocaleString('pt-BR',{maximumFractionDigits:d==null?1:d});}
/* 0,75 -> ¾ ; 1,5 -> 1½ (medidas caseiras) */
function frac(n){const w=Math.floor(n+1e-9),r=n-w,F=[[.25,'¼'],[.5,'½'],[.75,'¾']].find(f=>Math.abs(f[0]-r)<.03);
  return r<.03?String(w):r>.97?String(w+1):F?(w?w+F[1]:F[1]):fmt(n,1);}
const R0=n=>Math.round(n);
/* Medida em gramas: cada aparelho escolhe, por ingrediente (S.unit[id]='g'). */
function canGrams(id){const g=ING[id];return !!(g.hu||g.gw);}
function inGrams(id){return S.unit[id]==='g'&&canGrams(id);}
function gramsOf(id,q){const g=ING[id];return g.hu?q:q*(g.gw||1);}
function gUnit(id){return ING[id].u==='ml'?'ml':'g';}
function fq(id,q){
  if(inGrams(id))return `${fmt(gramsOf(id,q),0)} ${gUnit(id)} de ${SN[id]}`;
  const n=frac(q),pl=q>1.01;
  switch(id){
    case 'ovo': return `${n} ${pl?'ovos':'ovo'}`;
    case 'atum': case 'sardinha': return `${n} ${pl?'latas':'lata'} de ${SN[id]}`;
    case 'whey': return `${n} ${pl?'doses':'dose'} de whey`;
    case 'azeite': return `${n} col. sopa de azeite`;
    case 'banana': return `${n} ${pl?'bananas':'banana'}`;
    case 'limao': return `${n} ${pl?'limões':'limão'}`;
    case 'pao': return `${n} ${pl?'fatias':'fatia'} de pão`;
    case 'paofr': return `${n} ${pl?'pães franceses':'pão francês'}`;
    case 'ameixa': return `${n} ${pl?'ameixas':'ameixa'}`;
    case 'laranja': case 'kiwi': case 'maca': return `${n} ${SN[id]}${pl?'s':''}`;
    default:{const h=ING[id].hu;if(h){const m=q/h[2],u=ING[id].u==='ml'?'ml':'g',w=m>1.01?h[1]:h[0];
      /* "¾ tomate", não "¾ tomate de tomate" */
      const same=h[0].split(/[ -]/)[0]===SN[id].split(/[ -]/)[0];return `${frac(m)} ${w}${same?'':' de '+SN[id]} (${fmt(q,0)} ${u})`;}
      return `${fmt(q)} ${ING[id].u==='ml'?'ml':'g'} de ${SN[id]}`;}
  }
}

/* Ingredientes de uma refeição para uma pessoa, já com os ajustes feitos no editor (valem para todos os dias). */
function itemsOf(mid,who){
  const c=S.custom[mid]&&S.custom[mid][who];if(!c)return MEALS[mid][who];
  const base=MEALS[mid][who].map(i=>i[0]),pos=id=>{const i=base.indexOf(id);return i<0?100+ING_IDS.indexOf(id):i;};
  return Object.keys(c).filter(id=>ING[id]&&c[id]>0).sort((a,b)=>pos(a)-pos(b)).map(id=>[id,c[id]]);
}
function customOf(mid,who){
  S.custom[mid]=S.custom[mid]||{};
  if(!S.custom[mid][who]){const o={};MEALS[mid][who].forEach(i=>{o[i[0]]=i[1];});S.custom[mid][who]=o;}
  return S.custom[mid][who];
}
function isCustom(mid){const c=S.custom[mid];if(!c)return false;
  return ['L','P'].some(w=>c[w]&&JSON.stringify(itemsOf(mid,w))!==JSON.stringify(MEALS[mid][w]));}
function pOf(id){
  if(id==='iogurte') return S.ref.iog/100;
  if(id==='whey') return S.ref.whey;
  return ING[id].p;
}
function nut(items){let p=0,k=0;for(const it of items){p+=pOf(it[0])*it[1];k+=ING[it[0]].k*it[1];}return{p,k};}
const EXTRAS=[
  {id:'whey',n:'1 dose de whey',it:[['whey',1]]},
  {id:'atum',n:'1 lata de atum',it:[['atum',1]]},
  {id:'iogurte',n:'1 copo de iogurte (200 g)',it:[['iogurte',200]]},
  {id:'ovo',n:'1 ovo cozido',it:[['ovo',1]]},
  {id:'leite',n:'1 copo de leite (200 ml)',it:[['leite',200]]},
  {id:'mussarela',n:'2 fatias de mussarela (30 g)',it:[['mussarela',30]]},
  {id:'amendoim',n:'1 colher de pasta de amendoim (15 g)',it:[['amendoim',15]]}
];
/* Refeições do dia com as trocas feitas na aba Hoje. Tudo que é calculado (placar, compras, preparo) passa por aqui. */
const KIND={cafe:'cafe',almoco:'ref',jantar:'ref',lanche:'lanche',ceia:'ceia'};
function slotsOf(day){
  const out={};
  for(const k in day.slots){const sw=S.swap[`${day.d}|${k}`];out[k]=sw&&MEALS[sw]&&MEALS[sw].slot===KIND[k]?sw:day.slots[k];}
  return out;
}
/* Panela em dobro: um prato de panela (lote:1) que aparece em dois almoços/jantares seguidos é feito uma vez só.
   A primeira é 'cook' (faz em dobro), a segunda é 'sobra' (só esquentar). Segue as trocas: trocar uma das duas desfaz o par. */
const REF=['almoco','jantar'];
function loteMap(){const seq=[];for(const d of WEEK){const sl=slotsOf(d);for(const k of REF)if(sl[k])seq.push({d:d.d,k,mid:sl[k]});}
  const m={};for(let i=0;i+1<seq.length;i++){const a=seq[i],b=seq[i+1],ka=a.d+'|'+a.k;if(m[ka])continue;
    if(a.mid===b.mid&&MEALS[a.mid].lote){m[ka]={role:'cook',o:b};m[b.d+'|'+b.k]={role:'sobra',o:a};}}
  return {m,seq};}
function loteOf(d,k){return loteMap().m[d+'|'+k]||null;}
/* A sobra é comprada junto com o dia em que a panela é feita. */
function cookDate(d,k){const l=loteOf(d,k);return l&&l.role==='sobra'?l.o.d:d;}
/* Ceia = o que falta no dia. A quantidade da ceia de cada um é ajustada para completar a meta de proteína,
   depois de somar café, almoço, lanche e jantar planejados. Entre metade e o triplo da receita; se a meta já fechou, a ceia sai (f=0).
   Não ajusta se a ceia foi mexida à mão no editor, nem em dia parcial. */
function ceiaInfo(day,who){
  const sl=slotsOf(day),mid=sl.ceia;
  if(!mid||!sl.cafe||!sl.jantar||(S.custom[mid]&&S.custom[mid][who])||dayOver(day,'ceia',who))return {f:1,auto:false};
  let others=0;for(const s of SLOTS){if(s[0]==='ceia')continue;const m=sl[s[0]];if(m)others+=nut(dayOver(day,s[0],who)||itemsOf(m,who)).p;}
  /* extras registrados no dia (ex.: 1 dose de whey a mais) também contam */
  const ex=S.extras[`${day.d}|${who}`]||{};for(const e of EXTRAS){const c=ex[e.id]||0;if(c)others+=nut(e.it).p*c;}
  const base=nut(itemsOf(mid,who)).p||1,gap=S.targets[who].p-others;
  return {f:gap<=3?0:Math.min(3,Math.max(.5,gap/base)),auto:true,gap};
}
function scaleItems(its,f){if(f===1)return its;if(f===0)return [];return its.map(([id,q])=>{const st=ING[id].st||1;return [id,Math.max(st,Math.round(q*f/st)*st)];});}
/* Ingredientes de uma refeição num dia, para uma pessoa (com ajustes do editor e a ceia completando o dia). */
/* Mudança só de um dia ("não tinha ovo, comi queijo"): S.dayc['data|refeição'] = {mid, L:{item:qtd}, P:{…}}. Vale se a refeição do dia ainda é a mesma. */
function dayOver(day,slot,who){const o=S.dayc[day.d+'|'+slot];if(!o||o.mid!==slotsOf(day)[slot]||!o[who])return null;
  const base=itemsOf(o.mid,who).map(i=>i[0]),pos=id=>{const i=base.indexOf(id);return i<0?100+ING_IDS.indexOf(id):i;};
  return Object.keys(o[who]).filter(id=>ING[id]&&o[who][id]>0).sort((a,b)=>pos(a)-pos(b)).map(id=>[id,o[who][id]]);}
function dayItems(day,slot,who){const mid=slotsOf(day)[slot];if(!mid)return [];const ov=dayOver(day,slot,who);if(ov)return ov;const its=itemsOf(mid,who);return slot==='ceia'?scaleItems(its,ceiaInfo(day,who).f):its;}
function dayStats(day,who){
  const plan={p:0,k:0},done={p:0,k:0};
  const sl=slotsOf(day);for(const s of SLOTS){const mid=sl[s[0]];if(!mid)continue;const n=nut(dayItems(day,s[0],who));plan.p+=n.p;plan.k+=n.k;
    if(S.checks[`${day.d}|${s[0]}|${who}`]){done.p+=n.p;done.k+=n.k;}}
  const ex=S.extras[`${day.d}|${who}`]||{};const xt={p:0,k:0};
  for(const e of EXTRAS){const c=ex[e.id]||0;if(c){const n=nut(e.it);xt.p+=n.p*c;xt.k+=n.k*c;}}
  return{plan,done:{p:done.p+xt.p,k:done.k+xt.k},projected:{p:plan.p+xt.p,k:plan.k+xt.k},extra:xt};
}
function suggest(gap){
  if(gap<=3)return '';
  const pw=nut([['whey',1]]).p,py=nut([['iogurte',200]]).p,po=nut([['ovo',1]]).p;
  const c={w:0,y:0,o:0};let g=gap;
  while(g>2&&c.w+c.y+c.o<6){if(g>=pw*.8){c.w++;g-=pw;}else if(g>=py*.8){c.y++;g-=py;}else{c.o++;g-=po;}}
  const out=[];
  if(c.w)out.push(`${c.w} ${c.w>1?'doses':'dose'} de whey`);
  if(c.y)out.push(`${c.y} ${c.y>1?'copos':'copo'} de iogurte`);
  if(c.o)out.push(`${c.o} ${c.o>1?'ovos cozidos':'ovo cozido'}`);
  return out.join(' + ');
}

/* ===== DIAS DO PLANO: lotes do preparo ===== */
const DD=WEEK.map(d=>d.d),dia=i=>+DD[i].slice(8);
/* O que é cozido em lote é comprado antes do dia de cozinhar: lote 1 no domingo (cobre dom a ter), lote 2 na quarta de manhã (cobre qua a sáb). */
const BATCH1=DD.slice(0,3),BATCH2=DD.slice(3);
const ALL_DAYS=WEEK.map(d=>d.d);
function needs(days,onlyMeals){
  const out={};
  for(const day of WEEK){const sl=slotsOf(day);
    for(const s of SLOTS){const mid=sl[s[0]];if(!mid||!days.includes(cookDate(day.d,s[0])))continue;
      for(const who of ['L','P']){for(const it of dayItems(day,s[0],who)){
        const o=out[it[0]]||(out[it[0]]={tot:0,L:0,P:0,uses:[]});
        o.tot+=it[1];o[who]+=it[1];const sh=shortOf(mid);if(!o.uses.includes(sh))o.uses.push(sh);}}}}
  return out;
}
function buyText(it){
  const g=ING[it.id];
  if(g.loose){if(g.u==='un')return `${it.qty} un`;return it.qty>=1000?`${fmt(it.qty/1000,2)} kg`:`${it.qty} g`;}
  const n=it.packs;return `${n} ${n===1?g.pk[0]:g.pk[1]}${g.size?' de '+g.size:''}`;
}
function needText(id,q){
  const u=ING[id].u;
  if(u==='un')return `${fmt(q)} un`;if(u==='fatia')return `${fmt(q)} ${q===1?'fatia':'fatias'}`;if(u==='lata')return `${fmt(q)} ${q===1?'lata':'latas'}`;
  if(u==='ml')return `${fmt(q,0)} ml`;if(u==='g cozido')return `${fmt(q,0)} g cozido`;return `${fmt(q,0)} g`;
}
const PANTRY_STATIC=[
  {id:'sal',n:'Sal'},{id:'pimenta',n:'Pimenta-do-reino'},{id:'paprica',n:'Páprica'},
  {id:'oregano',n:'Orégano'},{id:'alho',n:'Alho (1 cabeça, só para o azeite aromatizado)'}];
/* ===== DESPENSA E LISTA DE COMPRAS (mercado sem dia certo) =====
   S.casa[id]: quanto tem em casa, na unidade da receita (lata, g, un, ml; arroz e feijão em peso cozido).
   Só é controlado o que já entrou em casa: comprado na lista, "Já tenho" ou ajustado em Em casa. O resto o app não sabe e não avisa.
   Marcar que comeu tira de casa o que estava no prato; desmarcar devolve (setCheck).
   S.shop[chave] = {id,q,d}: comprado agora (no carrinho). Já conta como em casa e passa para S.casa ao "Guardar" ou no dia seguinte.
   A lista = o que as refeições ainda não comidas de hoje até S.hz dias pedem, menos o que tem em casa. */
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return isoOf(d);};
/* qualquer data, também fora da semana atual: o cardápio-modelo do dia da semana + as trocas daquela data */
function dayFor(iso){const w=WEEK.find(x=>x.d===iso);if(w)return w;const p=PLANO[new Date(iso+'T12:00:00').getDay()];return {d:iso,wd:p.wd,slots:p.slots};}
function cartOf(id){let q=0;for(const k in S.shop){const c=S.shop[k];if(c&&typeof c==='object'&&c.id===id)q+=c.q||0;}return q;}
const known=id=>!!S.have[id]||id in S.casa||cartOf(id)>0;
function homeQ(id){return S.have[id]?Infinity:Math.max(0,(S.casa[id]||0)+cartOf(id));}
const r3=n=>Math.round(n*1000)/1000;
function eatMove(key,on){const [d,k,w]=key.split('|');if(!w)return;
  for(const [id,q] of dayItems(dayFor(d),k,w)){if(S.have[id]||!(id in S.casa||cartOf(id)>0))continue;
    S.casa[id]=r3(Math.max(-cartOf(id),(S.casa[id]||0)+(on?-q:q)));}}
function setCheck(key,on){on=!!on;if(!!S.checks[key]===on)return;S.checks[key]=on;eatMove(key,on);}
/* carrinho -> casa */
function stowCart(){let n=0;for(const k in S.shop){const c=S.shop[k];if(!c||typeof c!=='object')continue;n++;
    if(c.id&&ING[c.id])S.casa[c.id]=r3(Math.max(0,(S.casa[c.id]||0)+c.q));
    if(k.indexOf('m-')===0&&S.manual.lista)delete S.manual.lista[k.slice(2)];}
  S.shop={};return n;}
const dayWord=d=>d===HOJE?'hoje':d===addDays(HOJE,1)?'amanhã':(dayFor(d).wd||'').toLowerCase();
const slotWord=k=>(SLOTS.find(s=>s[0]===k)||['',''])[1].split(' ')[0].toLowerCase();
/* refeições que ainda não foram comidas, em ordem, de hoje até n dias */
function upcoming(n){const out=[];
  for(let i=0;i<n;i++){const day=dayFor(addDays(HOJE,i)),sl=slotsOf(day);
    for(const [k] of SLOTS){if(!sl[k])continue;for(const w of ['L','P']){if(S.checks[`${day.d}|${k}|${w}`])continue;const its=dayItems(day,k,w);if(its.length)out.push({d:day.d,k,w,its});}}}
  return out;}
function needsAhead(n){const out={};
  for(const m of upcoming(n))for(const [id,q] of m.its){const o=out[id]||(out[id]={tot:0,uses:[]});o.tot+=q;
    const u=`${dayWord(m.d)} ${slotWord(m.k)}`;if(!o.uses.includes(u))o.uses.push(u);}
  return out;}
/* o que falta em casa em cada refeição (só itens controlados): casa vai sendo gasta na ordem das refeições */
function shortages(n){const left={},out={};
  for(const m of upcoming(n))for(const [id,q] of m.its){if(!known(id)||S.have[id])continue;
    if(!(id in left))left[id]=homeQ(id);left[id]-=q;
    if(left[id]<-1e-6){const key=`${m.d}|${m.k}`;(out[key]=out[key]||new Set()).add(id);}}
  return out;}
/* até quando dá o que tem em casa: a primeira refeição que fica sem */
function runsOut(id,n){let left=homeQ(id);if(!isFinite(left))return null;
  for(const m of upcoming(n)){const it=m.its.find(i=>i[0]===id);if(!it)continue;left-=it[1];if(left<-1e-6)return m;}return false;}
const packsFor=(id,q)=>{const g=ING[id];return Math.max(1,Math.ceil(q*(g.f||1)/g.pack-1e-9));};
function shopList(){
  const n=S.hz||3,nd=needsAhead(n),rows=[];let w=0;
  for(const id in nd){const g=ING[id];if(!g||g.pantry||S.have[id])continue;
    const c=S.shop[id];if(c&&typeof c==='object'){rows.push({id,done:true,packs:c.p||1,qty:(c.p||1)*g.pack,need:nd[id].tot,uses:nd[id].uses});continue;}
    const home=homeQ(id),miss=nd[id].tot-home;if(miss<=1e-6)continue;
    const packs=packsFor(id,miss),wt=packs*g.pack*(g.wp||1);w+=wt;
    rows.push({id,packs,qty:packs*g.pack,need:nd[id].tot,home:known(id)?home:null,uses:nd[id].uses,wt});}
  /* comprado fora do plano que ainda está no carrinho */
  for(const k in S.shop){const c=S.shop[k];if(c&&c.id&&k===c.id&&!rows.some(r=>r.id===k)&&ING[k])rows.push({id:k,done:true,packs:c.p||1,qty:(c.p||1)*ING[k].pack,need:0,uses:[]});}
  rows.sort((a,b)=>ING[a.id].n.localeCompare(ING[b.id].n,'pt-BR'));
  return {rows,kg:w/1000,n};
}

/* ===== ITEM DIGITADO NAS COMPRAS: "2 kg batata", "3 iogurtes", "1 dúzia de ovos", "papel toalha" =====
   parseManual devolve o ingrediente reconhecido (id) e a quantidade em unidade de compra (q), ou só o corredor provável.
   O texto fica salvo como foi digitado (S.manual), e a leitura é refeita a cada vez: melhora sozinha quando o app aprende palavras novas. */
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9%.,½ ]/g,' ').replace(/\s+/g,' ').trim();}
/* plural simples do português: ovos -> ovo, pães -> pao, limões -> limao, maçãs -> maca */
function sing(w){return w.length>3?w.replace(/(oes|aes)$/,'ao').replace(/res$/,'r').replace(/s$/,''):w;}
const singAll=t=>t.split(' ').map(sing).join(' ');
const ALIAS={'peito de frango':'frango','sassami':'frango','file de frango':'frango','tilapia':'peixe','merluza':'peixe','file de peixe':'peixe',
  'pao de forma':'pao','pao frances':'paofr','pao de sal':'paofr','muçarela':'mussarela','mucarela':'mussarela','mozarela':'mussarela','queijo mussarela':'mussarela',
  'batata doce':'batatadoce','aipim':'mandioca','macaxeira':'mandioca','tomate pelado':'passata','molho de tomate':'passata','passata':'passata',
  'pasta de amendoim':'amendoim','grao de bico':'grao','flocao':'cuscuz','goma':'tapioca','queijo minas':'minas','iogurte natural':'iogurte','leite zero lactose':'leite',
  'whey protein':'whey','proteina de soja':'pts','soja texturizada':'pts','macarrao de arroz':'macarrao','ameixa':'ameixa','castanha do para':'castanha','queijo parmesao':'parmesao','queijo ralado':'parmesao','queijo coalho':'minas','queijo branco':'minas','achocolatado':'nescau','toddy':'nescau'};
let MIDX=null;
function ingIndex(){
  if(MIDX&&MIDX.n===ING_IDS.length)return MIDX;
  const list=ING_IDS.map(id=>{const names=[ING[id].n.split(/[(,]/)[0],SN[id]||''].map(x=>singAll(norm(x))).filter(Boolean);return {id,names};});
  return MIDX={n:ING_IDS.length,list};
}
function matchIng(name){
  const q=singAll(norm(name));if(!q)return null;
  for(const a in ALIAS)if(q===singAll(norm(a)))return ING[ALIAS[a]]?ALIAS[a]:null;
  const words=q.split(' ');let best=null;
  for(const c of ingIndex().list)for(const nm of c.names){
    if(nm===q)return c.id;
    const nw=nm.split(' ');
    /* todas as palavras digitadas aparecem no nome ("iogurte" -> iogurte natural…), o nome mais curto ganha */
    if(words.every(w=>nw.includes(w))&&(!best||nm.length<best.l))best={id:c.id,l:nm.length};
  }
  if(best)return best.id;
  for(const a in ALIAS){const an=singAll(norm(a));if(q.includes(an))return ING[ALIAS[a]]?ALIAS[a]:null;}
  return null;
}
const NUMW={um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,dez:10,doze:12,meia:.5,meio:.5};
const UNITW=[[/^(kg|kgs|quilos?|kilos?)$/,'kg'],[/^(g|gr|grs|gramas?)$/,'g'],[/^(l|lt|litros?)$/,'l'],[/^ml$/,'ml'],[/^(un|und|unid|unidades?)$/,'un'],
  [/^duzias?$/,'dz'],[/^(pct|pcts|pacotes?|caixas?|cx|latas?|bandejas?|potes?|macos?|garrafas?|pencas?|cachos?|barras?|pecas?|sacos?|vidros?|saquinhos?)$/,'pk']];
/* corredor provável do que não é ingrediente do app */
const KW=[['casa','detergente sabao amaciante desinfetante sanitaria esponja papel toalha higienico guardanapo lixo aluminio filme vassoura pano alcool multiuso lustra limpador'],
  ['hig','shampoo xampu condicionador sabonete dente escova desodorante absorvente fio algodao cotonete barbeador lamina hidratante protetor'],
  ['beb','cafe cha suco refrigerante agua cerveja vinho kombucha energetico'],
  ['hort','alface fruta verdura legume salsinha cebolinha hortela manjericao melancia melao manga pera abacate gengibre'],
  ['lat','queijo requeijao manteiga creme nata coalhada iogurte leite'],['prot','carne salmao camarao lombo'],
  ['merc','biscoito bolacha granola cereal farinha acucar sal oleo vinagre tempero massa arroz feijao molho fermento adocante gelatina']];
const MAN_AISLES={casa:'Limpeza e casa',hig:'Higiene',beb:'Bebidas',out:'Outros itens'};
function guessAisle(name){const ws=singAll(norm(name)).split(' ');for(const [a,l] of KW){const ks=l.split(' ');if(ws.some(w=>ks.includes(w)))return a;}return 'out';}
function parseManual(text){
  const t=String(text||'').trim();let ws=norm(t).replace(/^(\d+(?:[.,]\d+)?)(kg|g|ml|l|un)\b/,'$1 $2').split(' ').filter(Boolean);
  let n=null,u=null;
  if(ws.length&&/^\d+([.,]\d+)?$/.test(ws[0])){n=parseFloat(ws[0].replace(',','.'));ws.shift();}
  else if(ws.length&&ws[0]==='½'){n=.5;ws.shift();}
  else if(ws.length&&NUMW[ws[0]]!=null&&ws.length>1){n=NUMW[ws[0]];ws.shift();}
  if(ws.length>1){const f=UNITW.find(x=>x[0].test(ws[0]));if(f){u=f[1];ws.shift();}}
  if(ws[0]==='de'&&ws.length>1)ws.shift();
  const name=ws.join(' '),id=matchIng(name);
  if(!id)return {t,id:null,aisle:guessAisle(name)};
  const g=ING[id],pkd=!!g.pk&&!g.loose,unitW=g.hu?g.hu[2]:g.wp||g.gw||150;
  let q;
  if(u==='kg'||u==='g'||u==='l'||u==='ml'){const gr=n==null?1:n*(u==='kg'||u==='l'?1000:1);q=g.u==='g'||g.u==='g cozido'||g.u==='ml'?gr:gr/(g.wp||g.gw||1);}
  else if(u==='dz')q=(n||1)*12;
  else if(u==='pk')q=(n||1)*g.pack;
  else if(g.u==='un'||g.u==='lata')q=n!=null?n:(pkd?g.pack:1);
  else if(pkd)q=(n||1)*g.pack;
  else q=n!=null?n*unitW*(g.f||1):500*(g.f||1);
  return {t,id,q:Math.max(0,q)};
}

/* ===== SINCRONIZAÇÃO ENTRE OS APARELHOS (celulares e computadores, quantos forem) =====
   Firebase Realtime Database pela API REST (sem biblioteca): PATCH para gravar, EventSource para ouvir.
   Em comum: tudo que é do plano e da casa, inclusive o que cada um comeu (checks), extras e passos de receita.
   Só do aparelho: ícone e a escolha de ver em gramas (unit).
   A casa (…/casas/<código>) vem embutida no app (CASA, no fim deste arquivo): nada para configurar. */
const SHARED=['swap','shop','stock','have','pantry','prep','targets','ref','maxKg','custom','manual','checks','extras','steps','mine','ing','dayc','casa'];
/* passaram a sincronizar depois: na 1ª conexão de um aparelho que já estava na casa, o que só ele tem sobe (nada se apaga) */
const LATE=['checks','extras','steps'];
const SYK='cardapio-sync';
const SY={mig:false,based:false,merge:false,url:'',pend:{},state:'off',es:null,base:{},remote:null,sending:false,retry:null};

function syLoad(){try{const o=JSON.parse(localStorage.getItem(SYK)||'{}');SY.url=o.url||'';SY.pend=o.pend||{};SY.merge=!!o.merge;SY.mig=!!o.mig;}catch(e){}}
function syStore(){try{localStorage.setItem(SYK,JSON.stringify({url:SY.url,pend:SY.pend,merge:SY.merge,mig:SY.mig}));}catch(e){}}
function sharedOf(s){const o={};SHARED.forEach(f=>{if(s[f]!==undefined)o[f]=s[f];});return o;}
/* {shop:{'T1|ovo':true}} -> {'shop/T1|ovo':true}; objetos vazios somem, como no Firebase */
function flat(o,pre,out){out=out||{};
  for(const k in o){const v=o[k],p=pre?pre+'/'+k:k;
    if(v&&typeof v==='object')flat(v,p,out);else if(v!==undefined&&v!==null)out[p]=v;}
  return out;}
function unflat(f){const o={};
  for(const p in f){const ks=p.split('/');let c=o;for(let i=0;i<ks.length-1;i++)c=c[ks[i]]=(c[ks[i]]&&typeof c[ks[i]]==='object')?c[ks[i]]:{};c[ks[ks.length-1]]=f[p];}
  return o;}
function setPath(root,path,val){
  const ks=path.split('/').filter(Boolean);if(!ks.length)return val&&typeof val==='object'?val:{};
  let c=root;const trail=[];
  for(let i=0;i<ks.length-1;i++){if(!c[ks[i]]||typeof c[ks[i]]!=='object'){if(val===null)return root;c[ks[i]]={};}trail.push([c,ks[i]]);c=c[ks[i]];}
  const last=ks[ks.length-1];if(val===null)delete c[last];else c[last]=val;
  for(let i=trail.length-1;i>=0;i--){const [p,k]=trail[i];if(p[k]&&!Object.keys(p[k]).length)delete p[k];}
  return root;}

function syStatus(){
  const el=document.getElementById('sync-st');const n=Object.keys(SY.pend).length;
  const txt={off:'',conn:'Sincronizando…',ok:'Sincronizado com os outros aparelhos',offline:n?`Sem internet · ${n} ${n>1?'mudanças esperando':'mudança esperando'}`:'Sem internet · usando o que está salvo',erro:'Sincronização recusada pelo banco. Veja Ajustes.'}[SY.state]||'';
  if(el){el.textContent=txt;el.className='sync-st '+SY.state;el.hidden=!txt;}
  const box=document.getElementById('sync-box');if(box)box.textContent=txt||'Desligada';
}
/* Metas, referências, estoque e limite da mochila no valor padrão não sobem ao entrar: um aparelho em branco não pode trocar o que vocês ajustaram. */
function syMine(){const mine=flat(sharedOf(S)),def=flat({targets:DEF.targets,ref:DEF.ref,maxKg:DEF.maxKg,stock:DEF.stock});
  for(const k in def)if(mine[k]===def[k])delete mine[k];return mine;}
function sySet(st){SY.state=st;syStatus();}

/* Chamado depois de cada save(): o que mudou nas partes compartilhadas vira PATCH */
function syCollect(){
  const now=flat(sharedOf(S));
  for(const k in now)if(now[k]!==SY.base[k])SY.pend[k]=now[k];
  for(const k in SY.base)if(!(k in now))SY.pend[k]=null;
  SY.base=now;syStore();
}
function syPush(){if(!SY.url)return;if(SY.based)syCollect();if(SY.remote!==null)syFlush();}
async function syFlush(){
  if(!SY.url||SY.sending||!Object.keys(SY.pend).length){if(SY.url&&SY.state!=='erro'&&SY.remote!==null&&navigator.onLine!==false&&!Object.keys(SY.pend).length)sySet('ok');return;}
  SY.sending=true;const batch=Object.assign({},SY.pend);
  try{
    const r=await fetch(SY.url+'/s.json',{method:'PATCH',body:JSON.stringify(batch)});
    if(r.status===401||r.status===403){sySet('erro');return;}
    if(!r.ok)throw new Error(r.status);
    for(const k in batch)if(SY.pend[k]===batch[k])delete SY.pend[k];
    syStore();sySet(Object.keys(SY.pend).length?'conn':'ok');
  }catch(e){sySet('offline');clearTimeout(SY.retry);SY.retry=setTimeout(syFlush,15000);}
  finally{SY.sending=false;if(Object.keys(SY.pend).length&&SY.state!=='offline'&&SY.state!=='erro')syFlush();}
}
/* Estado do banco + mudanças locais ainda não enviadas -> S */
function syApply(){
  const merged=flat(SY.remote||{});
  for(const k in SY.pend){if(SY.pend[k]===null){for(const m in merged)if(m===k||m.indexOf(k+'/')===0)delete merged[m];}else merged[k]=SY.pend[k];}
  const sh=unflat(merged),before=JSON.stringify(sharedOf(S));
  for(const f of SHARED){
    if(f==='targets'){const t=sh.targets||{};S.targets={L:Object.assign({},DEF.targets.L,t.L),P:Object.assign({},DEF.targets.P,t.P)};}
    else if(f==='ref')S.ref=Object.assign({},DEF.ref,sh.ref);
    else if(f==='maxKg')S.maxKg=sh.maxKg!=null?sh.maxKg:DEF.maxKg;
    else if(f==='stock')S.stock=Object.assign(clone(DEF.stock),sh.stock);
    else S[f]=sh[f]||{};
  }
  applyUser();
  SY.base=flat(sharedOf(S));SY.based=true;
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(JSON.stringify(sharedOf(S))===before)return;
  const a=document.activeElement;
  if(!(a&&a.tagName==='INPUT'&&a.type!=='checkbox'))render(true);
}
function syListen(){
  if(SY.es)SY.es.close();SY.remote=null;sySet('conn');
  const es=SY.es=new EventSource(SY.url+'/s.json');
  const onEv=type=>e=>{let d;try{d=JSON.parse(e.data);}catch(x){return;}
    const first=SY.remote===null;
    if(first){SY.remote={};if(SY.based)syCollect();}else syCollect(); /* toque recente ainda não salvo não pode ser atropelado */
    if(type==='put')SY.remote=setPath(SY.remote,d.path,d.data);
    else for(const k in (d.data||{}))SY.remote=setPath(SY.remote,(d.path==='/'?'':d.path)+'/'+k,d.data[k]);
    if(first&&!Object.keys(SY.remote).length){
      /* casa nova e vazia: este aparelho manda o que tem */
      SY.pend=Object.assign(syMine(),SY.pend);SY.mig=true;syStore();SY.base=flat(sharedOf(S));
    }else if(first&&SY.merge){
      /* entrando numa casa que já tem dados: nada deste aparelho se perde. O que só existe aqui sobe;
         onde os dois têm (mesma troca, mesmo item, mesma refeição ajustada), vale o que já está no banco. */
      const grp=k=>{const p=k.split('/');return p.slice(0,p[0]==='custom'||p[0]==='manual'?3:2).join('/');};
      const rg=new Set(Object.keys(flat(SY.remote)).map(grp)),mine=syMine();
      for(const k in mine)if(!rg.has(grp(k)))SY.pend[k]=mine[k];
      SY.merge=false;SY.mig=true;syStore();
    }else if(first&&!SY.mig){
      const rk=new Set(Object.keys(flat(SY.remote))),mine=flat(sharedOf(S));
      for(const k in mine)if(LATE.includes(k.split('/')[0])&&!rk.has(k)&&!(k in SY.pend))SY.pend[k]=mine[k];
      SY.mig=true;syStore();
    }
    syApply();syFlush();};
  es.addEventListener('put',onEv('put'));
  es.addEventListener('patch',onEv('patch'));
  es.addEventListener('cancel',()=>{es.close();sySet('erro');});
  es.onopen=()=>{if(SY.state==='offline')sySet(Object.keys(SY.pend).length?'conn':'ok');syFlush();};
  es.onerror=()=>{if(SY.state!=='erro')sySet('offline');};
}
/* Sem configuração: todo aparelho que abre o app entra sozinho na mesma casa.
   Quem já tinha dados (ou estava numa casa criada à mão) entra mesclando: o que só ele tem sobe, nada se apaga.
   'cardapio-sync-test' troca o banco só para testes locais. */
const CASA=(()=>{let b='';try{b=localStorage.getItem('cardapio-sync-test')||'';}catch(e){}
  return (b||'https://cardapio-lucas-pri-default-rtdb.firebaseio.com')+'/casas/2jiut88v973bhzvr2pwq4dtm';})();
syLoad();
if(SY.url!==CASA){SY.url=CASA;SY.pend={};SY.merge=true;syStore();}
syListen();
/* Voltou para o app (celular tira a conexão em segundo plano): reconecta e pega o que mudou nos outros aparelhos. */
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&SY.url&&SY.state!=='erro'){saveNow();syListen();}});
window.addEventListener('online',()=>{if(SY.url){if(!SY.es||SY.es.readyState===2)syListen();else syFlush();}});

/* ===== PAINEL DE REFEIÇÃO (sobe de baixo): mudar os itens de uma refeição ou montar uma nova =====
   V.sheet = {mode:'edit', mid, key}            muda a refeição em todos os dias (S.custom, ou S.mine se foi montada por vocês)
           = {mode:'build', key, slot, n, L, P}  rascunho de refeição nova; ao salvar vira S.mine e entra no lugar desta
   Uma receita só para os dois: adicionar ou trocar um item vale para os dois; só a quantidade de cada um muda. */
const CAT_BY=Object.fromEntries(CATS.map(c=>[c[0],c[2]])),CAT_N=Object.fromEntries(CATS.map(c=>[c[0],c[1]]));
const cap=t=>t?t[0].toUpperCase()+t.slice(1):t;
/* No painel aberto pelo dia, "Só hoje" muda só aquele dia (S.dayc); "Todos os dias" muda a receita (S.custom). */
function shDay(sh){return sh.mode==='edit'&&sh.scope==='dia'&&sh.key?dayOf(sh.key.split('|')[0]):null;}
function shItems(sh,w){const d=shDay(sh);if(d)return dayItems(d,sh.key.split('|')[1],w);if(sh.mode==='edit')return itemsOf(sh.mid,w);const o=sh[w];return Object.keys(o).filter(i=>ING[i]&&o[i]>0).map(i=>[i,o[i]]);}
function shQ(sh,w,id){return (shItems(sh,w).find(i=>i[0]===id)||[0,0])[1];}
function shSet(sh,w,id,q){q=Math.max(0,Math.round(q*1000)/1000);
  if(sh.mode==='build'){if(q)sh[w][id]=q;else delete sh[w][id];return;}
  const d=shDay(sh);if(d){let o=S.dayc[sh.key];if(!o||o.mid!==sh.mid)o=S.dayc[sh.key]={mid:sh.mid};
    /* cada pessoa começa do que já tinha naquele dia; '_' mantém a lista mesmo vazia (o banco apaga objeto vazio) */
    ['L','P'].forEach(x=>{if(!o[x]){const n={_:0};shItems(sh,x).forEach(([i,v])=>{n[i]=v;});o[x]=n;}});
    if(q)o[w][id]=q;else delete o[w][id];return;}
  if(MEALS[sh.mid].user){const u=S.mine[sh.mid];u[w]=u[w]||{};if(q)u[w][id]=q;else delete u[w][id];applyUser();}
  else customOf(sh.mid,w)[id]=q;}
/* passo do + e −; em gramas, 5 g nos itens pequenos, 10 g no resto, 25 em leite e iogurte */
function stepOf(id){const g=ING[id];return inGrams(id)?(g.u==='ml'||id==='iogurte'?25:(g.st||1)<=15&&g.hu?5:10)/(g.hu?1:(g.gw||1)):(g.st||1);}
function porOf(id){const g=ING[id];return g.por!=null?g.por:g.fp?g.fp:g.hu?g.hu[2]:(g.u==='g'||g.u==='ml'||g.u==='g cozido')?100:1;}
/* porção ao adicionar: a típica para o Lucas, ~⅔ para a Pri, dentro do limite FODMAP dela (item que ela evita entra igual, com aviso) */
function addQty(id,w){const g=ING[id],st=g.st||1,r=q=>Math.max(st,Math.round(q/st)*st);let q=r(porOf(id));
  if(w==='P'){q=r(q*.65);if(g.pri>0&&q>g.pri)q=Math.max(st,Math.floor(g.pri/st)*st);}return q;}
/* troca convertida pelo que importa na categoria: 120 g de frango ≈ 4 ovos; 1 banana ≈ 12 morangos; pão por kcal */
function cvOf(id,by){const g=ING[id];return by==='p'?pOf(id):by==='fp'?(g.fp?1/g.fp:g.k/95):by==='g'?(g.u==='un'?(g.gw||g.wp||100):1):g.k;}
function conv(from,q,to){const by=CAT_BY[ING[from].cat]||'k';let a=cvOf(from,by),b=cvOf(to,by);if(!(a>0&&b>0)){a=ING[from].k;b=ING[to].k;}
  const st=ING[to].st||1;if(!(b>0))return Math.max(st,Math.round(porOf(to)/st)*st);return Math.max(st,Math.round(a*q/b/st)*st);}
function capPri(id,q){const g=ING[id],st=g.st||1;if(g.pri===0)return 0;return g.pri>0&&q>g.pri?Math.max(st,Math.floor(g.pri/st)*st):q;}
/* recentes (deste aparelho): aparecem primeiro na hora de adicionar */
function recents(){try{return JSON.parse(localStorage.getItem('cardapio-recentes')||'[]').filter(id=>ING[id]);}catch(e){return [];}}
function pushRecent(id){try{const r=recents().filter(x=>x!==id);r.unshift(id);localStorage.setItem('cardapio-recentes',JSON.stringify(r.slice(0,10)));}catch(e){}}

function sheetOpen(o){if(o.mode==='edit')o.scope=o.key?'dia':'sempre';V.sheet=o;V.sheetIn=true;V.sw=o.sw||null;V.shq='';V.swq='';V.shcat='';V.newIng=null;V.shIn=null;
  try{history.pushState({sheet:1},'');}catch(e){}render(true);
  if(o.sw)setTimeout(()=>{const el=document.getElementById('er-'+o.sw);if(el)el.scrollIntoView({block:'center'});},30);}
function sheetClose(fromPop){if(!V.sheet)return;V.sheet=null;V.newIng=null;
  if(!fromPop){try{if(history.state&&history.state.sheet)history.back();}catch(e){}}render(true);}
window.addEventListener('popstate',()=>{if(V.sheet)sheetClose(true);});

function amtHtml(sh,w,id,q){const a=amtOf(id,q),k=`${w}|${id}`;
  if(V.shIn===k)return `<input class="ed-in" type="text" inputmode="decimal" autocomplete="off" data-act="shset" data-w="${w}" data-id="${id}" value="${inGrams(id)?fmt(gramsOf(id,q),0):ING[id].hu?fmt(q/ING[id].hu[2],2):fmt(q,2)}" aria-label="Quantidade de ${SN[id]} para ${WHO[w]}">`;
  return `<button class="ed-v" data-act="shtype" data-key="${k}" aria-label="Digitar quantidade de ${SN[id]} para ${WHO[w]}"><b>${q?a.big:'0'}</b><small>${q?a.small:'não come'}</small></button>`;}
/* pesar em gramas o que é contado por medida (lata de atum, ovo, fatia): só muda como este celular mostra e digita */
function unitBtn(id){const g=ING[id];if(!canGrams(id)||g.u==='g'&&!g.hu||g.u==='ml'&&!g.hu)return '';
  const m=g.hu?g.hu[1]:g.u==='lata'?'latas':g.u==='un'?'unidades':g.u==='dose'?'doses':g.u==='cs'?'colheres':'medida';
  return `<button class="link" data-act="shunit" data-id="${id}">${inGrams(id)?'Usar '+m:g.u==='ml'?'Medir em ml':'Pesar em gramas'}</button>`;}
function stepHtml(sh,w,id,q){
  return `<div class="stp ${w}"><span class="stp-w">${WHO[w]}</span><button data-act="shq" data-w="${w}" data-id="${id}" data-d="-1" aria-label="Menos ${SN[id]} para ${WHO[w]}"${q?'':' disabled'}>−</button>
    ${amtHtml(sh,w,id,q)}<button data-act="shq" data-w="${w}" data-id="${id}" data-d="1" aria-label="Mais ${SN[id]} para ${WHO[w]}">+</button></div>`;}
function swapChips(sh,from,qL,qP){
  return `<input class="in-text sw-q" type="search" data-act="swq-in" placeholder="Buscar qualquer alimento: queijo, tapioca…" autocomplete="off" enterkeyhint="search" value="${esc(V.swq||'')}" aria-label="Buscar alimento para trocar">
    <div id="sw-res">${swapList(sh,from,qL,qP)}</div>`;}
/* nome, apelido (ALIAS) e nome curto: "queijo" acha minas, mussarela, cottage e parmesão */
function ingFind(q){q=singAll(norm(q));if(!q)return [];return ING_IDS.filter(id=>{const t=singAll(norm(ING[id].n+' '+(SN[id]||'')+' '+Object.keys(ALIAS).filter(a=>ALIAS[a]===id).join(' ')));return q.split(' ').every(w=>t.includes(w));});}
function swapList(sh,from,qL,qP){
  const cat=ING[from].cat,present=new Set(shItems(sh,'L').concat(shItems(sh,'P')).map(i=>i[0]));
  if((V.swq||'').trim()){const f=ingFind(V.swq).filter(id=>id!==from);
    if(!f.length)return `<div class="sub">Não achei “${esc(V.swq.trim())}”. <button class="link" data-act="shnewsw">Cadastrar</button></div>`;
    return `<div class="sw-list" role="list">${f.map(id=>swChip(from,id,qL,qP,present)).join('')}</div>`;}
  /* todas as opções da categoria, sem esconder nenhuma: as parecidas (PAR) primeiro. O que já está no prato aparece também e soma. */
  const near=(PAR[from]||[]).filter(id=>ING[id]&&id!==from),rest=ING_IDS.filter(id=>ING[id].cat===cat&&id!==from&&!near.includes(id));
  const opts=near.concat(rest);
  if(!opts.length)return `<div class="sub sw-none">Não há outro item de ${CAT_N[cat].toLowerCase()} cadastrado. Busque acima.</div>`;
  return `<div class="sw-list" role="list">${opts.map(id=>swChip(from,id,qL,qP,present)).join('')}</div>`;}
function swChip(from,id,qL,qP,present){const cat=ING[from].cat;
  {const g=ING[id],aL=qL?conv(from,qL,id):0,aP=qP?(g.pri>0?capPri(id,conv(from,qP,id)):conv(from,qP,id)):0;
    const byP=CAT_BY[cat]==='p',dL=R0(byP?pOf(id)*aL-pOf(from)*qL:ING[id].k*aL-ING[from].k*qL);
    return `<button class="sw-ch" role="listitem" data-act="shswap" data-from="${from}" data-to="${id}"><b>${cap(SN[id])}</b>
      <span class="sub"><span class="L">${aL?trq(id,aL):'—'}</span> · <span class="P">${aP?trq(id,aP)+(g.pri===0?' (evita)':''):'—'}</span></span>
      <span class="sub">${present.has(id)?'Já está no prato: soma':`Lucas ${dL>0?'+':dL<0?'−':'±'}${Math.abs(dL)} ${byP?'g de proteína':'kcal'}`}${known(id)?(homeQ(id)>=aL+aP-1e-6?' · <span class="ok-t">tem em casa</span>':' · <span class="warn-t">não tem em casa</span>'):''}</span></button>`;}}
function trq(id,q){return fq(id,q).replace(/ \(.*\)$/,'').replace(' de '+SN[id],'');}
function resultsHtml(sh){
  /* some da lista só o que os dois já têm: se só um tem, o botão adiciona para o outro */
  const has=w=>new Set(shItems(sh,w).map(i=>i[0])),hL=has('L'),hP=has('P');let ids,head='';
  const q=singAll(norm(V.shq||''));
  if(q){ids=ING_IDS.filter(id=>{const n=singAll(norm(ING[id].n+' '+(SN[id]||'')));return q.split(' ').every(w=>n.includes(w));});}
  else if(V.shcat)ids=ING_IDS.filter(id=>ING[id].cat===V.shcat);
  else{ids=recents();if(ids.length)head='<div class="sub res-h">Usados por último</div>';else ids=['ovo','iogurte','whey','banana','pao','aveia','cottage','amendoim','tapioca','mussarela'];}
  ids=ids.filter(id=>!(hL.has(id)&&hP.has(id))).slice(0,24);
  const chips=ids.map(id=>{const fw=hP.has(id)?' para o Lucas':hL.has(id)?' para a Pri':'';
    return `<button class="ch-add" data-act="shadd" data-id="${id}">+ ${cap(SN[id]||ING[id].n)}${fw}${ING[id].pri===0&&!hP.has(id)?' <small>(Pri evita)</small>':''}</button>`;}).join('');
  const exact=q&&ING_IDS.some(id=>singAll(norm(SN[id]||''))===q||singAll(norm(ING[id].n))===q);
  const nw=q&&!exact&&!chips?`<button class="ch-add new" data-act="shnew">+ Cadastrar “${esc(V.shq.trim())}”</button>`:'';
  return head+(chips||nw?`<div class="res-chips">${chips}${nw}</div>`:'<div class="sub">Nada encontrado.</div>');}
function newIngForm(){const f=V.newIng;
  return `<form class="new-ing card" data-act="ingsave"><div class="eyebrow">Ingrediente novo</div>
   <div class="sub">Olhe a tabela do rótulo. Ele passa a valer no app todo: montar, trocar e compras.</div>
   <label class="fl">Nome<input class="in-text" name="n" maxlength="40" required value="${esc(f.n)}"></label>
   <div class="fl-row"><label class="fl">Conta por<select name="u"><option value="g">100 g</option><option value="un">unidade</option></select></label>
   <label class="fl">Categoria<select name="cat">${CATS.map(c=>`<option value="${c[0]}"${c[0]===f.cat?' selected':''}>${c[1]}</option>`).join('')}</select></label></div>
   <div class="fl-row"><label class="fl">Proteína (g)<input class="in-text" name="p" inputmode="decimal" required placeholder="ex.: 6"></label>
   <label class="fl">Energia (kcal)<input class="in-text" name="k" inputmode="decimal" required placeholder="ex.: 90"></label></div>
   <div class="row"><button class="btn" type="button" data-act="shnewx">Cancelar</button><button class="btn primary" type="submit">Cadastrar e adicionar</button></div></form>`;}
function sheetHtml(){
  const sh=V.sheet;if(!sh)return '';
  if(sh.mode==='edit'&&!MEALS[sh.mid]){V.sheet=null;return '';}
  const iL=shItems(sh,'L'),iP=shItems(sh,'P'),nL=nut(iL),nP=nut(iP);
  const ids=[...new Set(iL.map(i=>i[0]).concat(iP.map(i=>i[0])))];
  const rows=ids.map(id=>{const g=ING[id],qL=shQ(sh,'L',id),qP=shQ(sh,'P',id),open=V.sw===id;
    const warn=qP&&g.pri!=null&&qP>g.pri?`<span class="ed-warn">${g.pri===0?'A Pri evita (FODMAP)':'Acima do limite FODMAP da Pri'}</span>`:'';

/* Uma receita, duas quantidades: uma linha por ingrediente, Lucas e Pri lado a lado. Tocar no nome troca o item. */
function qtyTable(day,k,mid){
  const key=`${day.d}|${k}`,iL=dayItems(day,k,'L'),iP=dayItems(day,k,'P'),q=(its,id)=>(its.find(i=>i[0]===id)||[0,0])[1];
  const ids=[...new Set(iL.concat(iP).map(i=>i[0]))],nL=nut(iL),nP=nut(iP);
  const rows=ids.map(id=>`<tr><th><button data-act="shopen" data-key="${key}" data-mid="${mid}" data-id="${id}" aria-label="Trocar ${cap(SN[id]||ING[id].n)}">${cap(SN[id]||ING[id].n)}<span aria-hidden="true">⇄</span></button></th>${qtyCell(id,q(iL,id))}${qtyCell(id,q(iP,id))}</tr>`).join('');
  const empty=w=>!(w==='L'?iL:iP).length?'<div class="sub">Não precisa hoje. Se der fome, metade da receita.</div>':'';
  return `<table class="qtab"><thead><tr><th><span class="sub">Toque no item para trocar</span></th><th class="L">Lucas</th><th class="P">Pri</th></tr></thead>
   <tbody>${rows}<tr class="add"><th colspan="3"><button data-act="shopen" data-key="${key}" data-mid="${mid}">+ Adicionar item</button></th></tr></tbody>
   <tfoot><tr><th>Proteína</th><td>${R0(nL.p)} g</td><td>${R0(nP.p)} g</td></tr><tr><th>Energia</th><td>${R0(nL.k)} kcal</td><td>${R0(nP.k)} kcal</td></tr></tfoot></table>${empty('L')}${empty('P')}`;
}
/* Passo a passo dentro da refeição: cozinhar sem trocar de aba. Marcações valem para aquele dia. */
function howTo(day,k,mid,lo){
  const key=`${day.d}|${k}`,open=!!V.open['how|'+key],r=RECIPES[mid]||{steps:['Separe os itens da tabela e monte o prato de cada um.'],tips:[]};
  const steps=lo&&lo.role==='sobra'?['Pegue a porção de cada um que ficou na geladeira.','Esquente no micro-ondas por 2 a 3 min, mexendo na metade.']:r.steps;
  const sk=i=>`${key}|${mid}|${i}`,done=steps.filter((x,i)=>S.steps[sk(i)]).length;
  return `<div class="howto"><button class="howto-h" data-act="howto" data-key="${key}" aria-expanded="${open}"><span><b>Como fazer</b><span class="sub"> · ${done?`${done} de ${steps.length} feitos`:`${steps.length} ${steps.length>1?'passos':'passo'}`}</span></span>${CHEV}</button>
   ${open?`<ol class="steps">${steps.map((x,i)=>`<li class="${S.steps[sk(i)]?'done':''}" data-act="step" data-key="${sk(i)}"><span>${x}</span></li>`).join('')}</ol>${!(lo&&lo.role==='sobra')&&r.tips&&r.tips.length?`<div class="note">${r.tips.map(t=>`<div>${t}</div>`).join('')}</div>`:''}`:''}</div>`;}
/* Próxima refeição de hoje: a primeira que ainda não foi marcada pelos dois. */
function nextSlot(day){if(day.d!==TODAY)return null;const f=SLOTS.find(s=>day.slots[s[0]]&&!(S.checks[`${day.d}|${s[0]}|L`]&&S.checks[`${day.d}|${s[0]}|P`]));return f?f[0]:null;}
function slotCard(day,k,label,nk){
  const base=day.slots[k],mid=slotsOf(day)[k],m=MEALS[mid],key=`${day.d}|${k}`,sw=V.swap===key,lo=loteOf(day.d,k);
  const open=key in V.open?V.open[key]:(k===nk||sw);
  const ck=w=>!!S.checks[`${key}|${w}`];
  const meta=[lo&&lo.role==='sobra'?'5 min · sobra':`${m.t} min${lo?' · em dobro':''}`,mid!==base?'trocado':'',S.dayc[key]&&S.dayc[key].mid===mid?'mudado só neste dia':'',isCustom(mid)?'ajustado':'',m.user?'de vocês':''].filter(Boolean).join(' · ');
  const dots=['L','P'].map(w=>`<span class="eat-dot ${w}${ck(w)?' on':''}" aria-label="${WHO[w]} ${ck(w)?'comeu':'ainda não'}"></span>`).join('');
  if(!open)return `<article class="slot closed${ck('L')&&ck('P')?' done':''}" id="s-${key}"><button class="slot-row" data-act="slotopen" data-key="${key}" aria-expanded="false">
     <span class="mini">${ill(mid)}</span><span class="sr-tx"><span class="tag">${label}</span><b>${m.n}</b><span class="sub">${meta}</span></span><span class="dots">${dots}</span>${CHEV}</button></article>`;
  /* dono deste celular primeiro, como "Eu comi"; o outro ao lado; "Comemos juntos" marca os dois de uma vez */
  const me=S.me==='L'||S.me==='P'?S.me:'',order=me==='P'?['P','L']:['L','P'];
  const eat=order.map(w=>{const on=ck(w),mine=w===me;return `<label class="eat ${w}${on?' on':''}${mine?' me':''}"><input type="checkbox" data-act="chk" data-key="${key}|${w}"${on?' checked':''}><span class="box">${CHECK}</span>${mine?(on?'Eu comi':'Eu comi?'):`${WHO[w]} ${on?'comeu':'comeu?'}`}</label>`;}).join('')
    +(!(ck('L')&&ck('P'))?`<button class="link both" data-act="both" data-key="${key}">Comemos juntos: marcar os dois</button>`:'');
  return `<article class="slot open${k===nk?' now':''}" id="s-${key}">
   <button class="hero" data-act="slotopen" data-key="${key}" aria-expanded="true" aria-label="Recolher ${label}">${ill(mid)}<span class="hero-tag">${k===nk?'Agora · ':''}${label}</span>${CHEV}</button>
   <div class="slot-b"><h3>${m.n}</h3><div class="sub">${meta}</div>
   <div class="eats">${eat}</div>${V.sh&&V.sh[key]&&!(ck('L')&&ck('P'))?`<button class="buy warn" data-act="golist">Falta em casa: ${[...V.sh[key]].map(i=>SN[i]||ING[i].n).join(', ')} · já está na lista</button>`:''}
   ${k==='ceia'?ceiaNote(day):''}${juntoBlock(mid,day,k)}${qtyTable(day,k,mid)}${howTo(day,k,mid,lo)}
   <div class="slot-actions"><button class="btn small" data-act="shopen" data-key="${key}" data-mid="${mid}">Mudar itens</button><button class="btn small" data-act="swapopen" data-key="${key}" aria-expanded="${sw}">${sw?'Fechar trocas':'Trocar refeição'}</button>
   <button class="btn small" data-act="recipe" data-id="${mid}">Receita</button>
   ${mid!==base?`<button class="link" data-act="swap" data-key="${key}" data-id="${base}">Voltar ao plano</button>`:''}</div>
   ${sw?altsBlock(day,k,mid):''}</div></article>`;
}
function extrasBlock(day){
  const w=V.extraWho,key=`${day.d}|${w}`,ex=S.extras[key]||{};
  const tabs=['L','P'].map(x=>`<button class="chip" data-act="exwho" data-who="${x}" aria-pressed="${x===w}"><span class="dot ${x}"></span>${WHO[x]}</button>`).join('');
  const pills=EXTRAS.map(e=>{const n=nut(e.it),c=ex[e.id]||0;
    return `<span class="pill"><span>${e.n} <b>+${R0(n.p)} g</b></span>${c?`<button class="pm" data-act="exdel" data-id="${e.id}" aria-label="Tirar um">−</button><span class="ct">${c}</span>`:''}<button class="pm add" data-act="exadd" data-id="${e.id}" aria-label="Adicionar ${e.n}">+</button></span>`;}).join('');
  return `<section class="card stack"><div><div class="eyebrow">Extras do dia</div><div class="sub">Comeu algo fora do plano? Registre e o placar atualiza.</div></div>
   <div class="row">${tabs}</div><div class="pills">${pills}</div></section>`;
}
function meOpts(){return [['L','Lucas'],['P','Pri'],['both','Dos dois']].map(o=>`<button class="chip" data-act="me" data-id="${o[0]}" aria-pressed="${S.me===o[0]}">${o[0]!=='both'?`<span class="dot ${o[0]}"></span>`:''}${o[1]}</button>`).join('');}
function viewHoje(){
  const day=dayOf(V.day),nk=nextSlot(day),ahead=Math.round((new Date(day.d+'T12:00:00')-new Date(HOJE+'T12:00:00'))/864e5);
  V.sh=ahead>=0?shortages(ahead+1):{};
  const chips=WEEK.map(x=>`<button class="chip day-chip${x.d===TODAY?' today':''}" data-act="day" data-day="${x.d}" aria-pressed="${x.d===V.day}"><span>${x.wd}</span><b>${+x.d.slice(8)}</b></button>`).join('');
  const partial=!day.slots.cafe?'Dia parcial: o café e o almoço já passaram.':(!day.slots.jantar?'Dia parcial: o jantar fica para a próxima semana.':'');
  const slots=SLOTS.filter(s=>day.slots[s[0]]).map(s=>slotCard(day,s[0],s[1],nk)).join('');
  return `<div class="chips days" role="group" aria-label="Escolha o dia">${chips}</div>
   <div class="score">${S.me==='P'?scoreCard(day,'P')+scoreCard(day,'L'):scoreCard(day,'L')+scoreCard(day,'P')}</div>
   ${S.me?'':`<section class="card me-ask"><b>De quem é este celular?</b><span class="sub">Assim o “Eu comi” fica com você. Dá para mudar em Ajustes.</span>
     <div class="me-opts">${meOpts()}</div></section>`}
   <div class="stack">${partial?`<div class="sub">${partial}</div>`:''}${advice(day)}${slots}${extrasBlock(day)}</div>`;
}

/* ----- SEMANA ----- */
/* Marcas do dia: compra e bloco de preparo que começam nele (tocar leva para a aba). */
function dayMarks(d){const o=[];
  if(d===BATCH1[0]||d===BATCH2[0])o.push('<button class="mark prep" data-act="nav" data-v="preparo">Preparo</button>');return o.join('');}
function viewSemana(){
  const full=WEEK.filter(d=>d.slots.cafe&&d.slots.jantar);
  const avg=w=>full.reduce((a,d)=>a+dayStats(d,w).plan.p,0)/full.length;
  const okDays=full.filter(d=>['L','P'].every(w=>dayStats(d,w).plan.p>=S.targets[w].p*.95)).length;
  /* refeição igual todos os dias (o lanche): aparece uma vez no topo, não em cada dia */
  const same=SLOTS.map(s=>s[0]).filter(k=>{const ms=WEEK.filter(d=>slotsOf(d)[k]).map(d=>slotsOf(d)[k]);return ms.length>2&&ms.every(m=>m===ms[0]);});
  const lbl=k=>SLOTS.find(s=>s[0]===k)[1];
  const stat=w=>`<div class="stat ${w}"><span class="nm"><span class="dot ${w}"></span>${WHO[w]}</span><b>${R0(avg(w))} g</b><span class="sub">por dia · meta ${S.targets[w].p}</span></div>`;
  const cards=WEEK.map(d=>{
    const sl=slotsOf(d),past=d.d<TODAY;
    const rows=SLOTS.filter(s=>sl[s[0]]&&!same.includes(s[0])).map(s=>{const mid=sl[s[0]],lo=loteOf(d.d,s[0]);
      return `<li><button data-act="weekslot" data-day="${d.d}" data-k="${s[0]}"><span class="sl">${s[1].split(' ')[0]}</span><span class="mini">${ill(mid)}</span><span class="wn">${MEALS[mid].n}${lo&&lo.role==='sobra'?' <span class="sub">· sobra</span>':''}${mid!==d.slots[s[0]]?' <span class="sub">· trocado</span>':''}</span></button></li>`;}).join('');
    const l=dayStats(d,'L').plan,p=dayStats(d,'P').plan,low=d.slots.cafe&&d.slots.jantar&&(l.p<S.targets.L.p*.95||p.p<S.targets.P.p*.95);
    return `<article class="dayc${d.d===TODAY?' is-today':''}${past?' past':''}"><div class="top"><button class="dh" data-act="day-go" data-day="${d.d}"><h3>${WD_FULL[d.wd]} ${+d.d.slice(8)}</h3>${d.d===TODAY?'<span class="tag">hoje</span>':''}</button>
      <span class="tots"><span class="tot L">${R0(l.p)} g</span><span class="tot P">${R0(p.p)} g</span></span></div>
      ${dayMarks(d.d)||low?`<div class="marks">${dayMarks(d.d)}${low?'<span class="mark warn">abaixo da meta</span>':''}</div>`:''}<ul>${rows}</ul></article>`;}).join('');
  return `<div class="stack"><section class="card stack"><div class="eyebrow">Média planejada de proteína</div>
   <div class="stats">${stat('L')}${stat('P')}</div>
   <div class="sub">${okDays} de ${full.length} dias completos dentro da meta.${same.map(k=>` ${lbl(k)} todo dia: ${MEALS[slotsOf(WEEK.find(d=>slotsOf(d)[k]))[k]].n}.`).join('')} Toque numa refeição para trocar.</div></section>
   <div class="week">${cards}</div></div>`;
}

/* ----- COMPRAS ----- */
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
/* quanto tem em casa, do jeito que se compra: "3 latas", "1,2 kg", "400 g crus" de arroz */
function casaTxt(id,q){const g=ING[id];
  if(g.u==='g cozido'){const r=q*(g.f||1);return r>=1000?`${fmt(r/1000,2)} kg crus`:`${fmt(r,0)} g crus`;}
  if(g.u==='g'||g.u==='ml'){const big=g.u==='ml'?'L':'kg';return q>=1000?`${fmt(q/1000,2)} ${big}`:`${fmt(q,0)} ${g.u}`;}
  return trq(id,q);}
function casaStep(id){const g=ING[id];return g.u==='g cozido'?100:(g.u==='g'||g.u==='ml')?(g.pack>=400?100:50):(g.st||1);}
const packQ=id=>{const g=ING[id];return r3(g.pack/(g.f||1));};
function runTxt(id){const m=runsOut(id,14);if(m===null)return 'sempre tem';if(m===false)return homeQ(id)>0?(needsAhead(14)[id]?'dá para as próximas 2 semanas':'fora do plano'):'acabou';
  return `${homeQ(id)<=1e-6?'acabou · ':''}falta ${dayWord(m.d)} no ${slotWord(m.k)}`;}
function viewCompras(){
  /* comprado em outro dia já está guardado: carrinho de ontem vai para a casa */
  if(Object.values(S.shop).some(c=>c&&typeof c==='object'&&c.d&&c.d<HOJE)){stowCart();save();}
  const cv=V.cv||'falta';
  const ctrl=[...new Set(Object.keys(S.casa).concat(Object.values(S.shop).map(c=>c&&c.id)))].filter(id=>id&&ING[id]);
  const L=shopList(),todo=L.rows.filter(r=>!r.done);
  const lista=S.manual.lista||{},mk=Object.keys(lista),mDone=k=>!!S.shop['m-'+k];
  const nTodo=todo.length+mk.filter(k=>!mDone(k)).length;
  const seg=`<div class="seg" role="group" aria-label="Lista ou casa"><button data-act="cv" data-v="falta" aria-pressed="${cv==='falta'}">Falta comprar${nTodo?` · ${nTodo}`:''}</button><button data-act="cv" data-v="casa" aria-pressed="${cv==='casa'}">Em casa${ctrl.length?` · ${ctrl.length}`:''}</button></div>`;
  return `<div class="stack">${seg}${cv==='casa'?viewCasa(ctrl):viewFalta(L,todo,lista,mk,mDone)}</div>`;
}
function viewFalta(L,todo,lista,mk,mDone){
  const HZ=[[2,'Hoje e amanhã'],[3,'3 dias'],[5,'5 dias'],[7,'Semana']];
  const hz=HZ.map(h=>`<button class="chip" data-act="hz" data-n="${h[0]}" aria-pressed="${L.n===h[0]}">${h[1]}</button>`).join('');
  const inCart=Object.values(S.shop).filter(c=>c&&typeof c==='object').length,over=L.kg>S.maxKg;

       <span class="nm">${g.n}</span><span class="qt">${buyText(r)}</span><span class="meta">${why}</span></label>${on?'':`<button class="link have-b" data-act="jatenho" data-id="${r.id}">Já tenho</button>`}</div>`});});
  mk.forEach(k=>{const m=parseManual(lista[k]),on=mDone(k),n=esc(m.t),ai=m.id?ING[m.id].aisle:m.aisle;

  const order=['hort','prot','lat','merc','desp','beb','hig','casa','out'],AN=Object.assign({},AISLES,MAN_AISLES);

    return `<section class="aisle"><h3>${AN[a]||'Outros itens'}<span class="sub">${done}/${rs.length}</span></h3><div class="list">${rs.map(r=>r.html).join('')}</div></section>`;}).join('');
  const fresh=!Object.keys(S.casa).length&&!inCart;
  const head=`<section class="card stack"><div><div class="eyebrow">Para as próximas refeições</div>
     <div class="sub">${todo.length?`${todo.length} ${todo.length>1?'itens':'item'} · mochila ~${fmt(L.kg,1)} kg`:'Nada faltando para esse período.'}${over?` · passa de ${S.maxKg} kg, dá para dividir em duas idas`:''}</div></div>
     <div class="chips">${hz}</div>
     ${fresh?'<div class="tip">Toque em <b>Já tenho</b> no que já está em casa. A partir daí o app sabe: o que vocês comem sai sozinho e o que compram entra.</div>':''}
     ${inCart?`<div class="cart-l"><span>${inCart} no carrinho</span><button class="btn small primary" data-act="stow">Guardar em casa</button></div>`:''}</section>`;
  const past=[...new Set(Object.values(S.manual).flatMap(o=>Object.values(o||{})).map(String))].filter(x=>!mk.some(k=>norm(lista[k])===norm(x))).slice(-8).reverse();
  const manual=`<section class="card stack add-shop"><div><div class="eyebrow">Adicionar à lista</div>
    <div class="sub">Escreva como falaria: “2 kg batata”, “detergente”.</div></div>
    <form class="man-add" data-act="manadd"><input id="man-in" class="in-text" type="text" list="ing-list" data-act="manin" maxlength="60" autocomplete="off" enterkeyhint="done" placeholder="Ex.: 2 kg batata" aria-label="Item para adicionar"><button class="btn primary" type="submit">Adicionar</button></form>
    <div id="man-hint" class="sub man-hint"></div>
    <datalist id="ing-list">${ING_IDS.map(id=>`<option value="${esc(cap(SN[id]||ING[id].n))}">`).join('')}</datalist>
    ${past.length?`<div class="pills">${past.map(x=>`<button class="chip" data-act="manpick" data-t="${esc(x)}">+ ${esc(x)}</button>`).join('')}</div>`:''}</section>`;
  const pn=needsAhead(7);
  const comp=Object.keys(pn).filter(id=>ING[id].pantry).map(id=>{const g=ING[id];
    return {id,n:g.n,t:id==='whey'?`${fmt(pn[id].tot,0)} doses por semana (~${fmt(pn[id].tot*30/1000,2)} kg de pó)`:`~${fmt(pn[id].tot*g.mlPerUnit,0)} ml por semana`};});
  const prow=comp.concat(PANTRY_STATIC.map(p=>({id:p.id,n:p.n,t:''}))).map(p=>{const on=!!S.pantry[p.id];
    return `<label class="item${on?' done':''}"><input type="checkbox" data-act="pantry" data-key="${p.id}"${on?' checked':''}><span class="box">${CHECK}</span><span class="nm">${p.n}</span><span class="qt">${on?'tem':'conferir'}</span>${p.t?`<span class="meta"><span>${p.t}</span></span>`:''}</label>`;}).join('');
  const pantry=`<details class="aisle pantry"><summary><h3>${AISLES.desp}<span class="sub">conferir de vez em quando</span></h3></summary><div class="list">${prow}</div></details>`;
  return `${head}${aisles}${manual}${pantry}`;
}
function viewCasa(ctrl){
  const rows=ctrl.slice().sort((a,b)=>{const x=runsOut(a,14),y=runsOut(b,14),rk=m=>m===false||m===null?99:upcoming(14).indexOf(m);return rk(x)-rk(y)||ING[a].n.localeCompare(ING[b].n,'pt-BR');}).map(id=>{
    const g=ING[id],q=homeQ(id),m=runsOut(id,14),low=m&&m.d<=addDays(HOJE,1);
    return `<div class="crow${low?' low':''}${q<=1e-6?' out':''}"><div class="c-tx"><b>${cap(SN[id]||g.n)}</b><span class="sub">${runTxt(id)}</span></div>
      <div class="c-q"><button data-act="casa" data-id="${id}" data-d="-1" aria-label="Menos ${SN[id]}"${q<=1e-6?' disabled':''}>−</button><span>${q>1e-6?casaTxt(id,q):'0'}</span><button data-act="casa" data-id="${id}" data-d="1" aria-label="Mais ${SN[id]}">+</button></div>
      <div class="c-a">${g.pk?`<button class="link" data-act="casa" data-id="${id}" data-d="pk">+ 1 ${g.pk[0]}</button>`:''}${q>1e-6?`<button class="link" data-act="casa" data-id="${id}" data-d="0">Acabou</button>`:''}<button class="link danger" data-act="casadel" data-id="${id}">Não controlar</button></div></div>`;}).join('');
  const HAVE=['arroz','feijao','aveia','pao','macarrao','amendoim','passata','whey'];
  const havePills=HAVE.filter(id=>ING[id]).map(id=>`<button class="chip" data-act="have" data-id="${id}" aria-pressed="${!!S.have[id]}">${cap(SN[id]||ING[id].n).replace(' cozido','')}</button>`).join('');
  return `<section class="card stack"><div><div class="eyebrow">O que tem em casa</div><div class="sub">Comprou na lista, entra aqui. Marcou que comeu, sai daqui.</div></div>
     <input class="in-text" type="search" data-act="casa-q" placeholder="Adicionar o que tem: ovo, aveia…" autocomplete="off" aria-label="Buscar alimento para pôr em casa" value="${esc(V.casaq||'')}">
     <div id="casa-res">${casaRes()}</div></section>
   ${rows?`<div class="list casa-l">${rows}</div>`:'<div class="sub empty">Ainda nada. Busque acima ou toque em “Já tenho” na lista.</div>'}

/* ----- RECEITAS ----- */
function whereUsed(id){const out=[];WEEK.forEach(d=>{const sl=slotsOf(d);SLOTS.forEach(s=>{if(sl[s[0]]===id)out.push(`${d.wd} ${d.d.slice(8)} (${s[1].split(' ')[0].toLowerCase()})`);});});return out.length?out.join(', '):'nenhum dia. Use o botão Trocar na aba Hoje para colocar no plano.';}
/* o que a receita pede em casa (só o que o app controla): {ok, falta:[ids]} */
function recCasa(id){const need={};['L','P'].forEach(w=>itemsOf(id,w).forEach(([i,q])=>{need[i]=(need[i]||0)+q;}));
  const ids=Object.keys(need),k=ids.filter(known),falta=k.filter(i=>homeQ(i)<need[i]-1e-6);
  return {all:ids.length&&k.length===ids.length,falta,k:k.length};}
function recBadge(id){if(!MEALS[id])return '';const c=recCasa(id);
  if(c.falta.length)return `<span class="rb warn">falta ${c.falta.length>1?c.falta.length+' itens':SN[c.falta[0]]||ING[c.falta[0]].n}</span>`;
  return c.all?'<span class="rb ok">tem tudo em casa</span>':'';}
const SLOT_OF={cafe:['cafe'],ref:['almoco','jantar'],lanche:['lanche'],ceia:['ceia']};
/* pôr esta receita no lugar de uma refeição dos próximos 3 dias */
function planChips(id){const m=MEALS[id],out=[];
  for(let i=0;i<3;i++){const d=dayFor(addDays(HOJE,i));for(const k of SLOT_OF[m.slot]||[]){if(!d.slots[k])continue;const key=`${d.d}|${k}`;
    if(S.checks[key+'|L']&&S.checks[key+'|P'])continue;const on=slotsOf(d)[k]===id;
    out.push(`<button class="chip" data-act="plan" data-key="${key}" data-id="${id}" aria-pressed="${on}">${cap(dayWord(d.d))} · ${slotWord(k)}</button>`);}}
  return out.length?`<div class="plan-in"><div class="eyebrow">Pôr no plano</div><div class="chips">${out.join('')}</div></div>`:'';}
function recTag(id){const m=MEALS[id]||BASES[id];return `${m.user?'De vocês · ':''}${MEALS[id]?(m.outros?'Outros':m.slot==='cafe'?'Café':m.slot==='ref'?'Almoço ou jantar':m.slot==='lanche'?'Lanche':'Ceia'):'Preparo base'}`;}
function recCard(id){
  const m=MEALS[id]||BASES[id],open=!!V.open[id],isMeal=!!MEALS[id];
  const prot=isMeal?`<span class="L">${R0(nut(itemsOf(id,'L')).p)} g</span> · <span class="P">${R0(nut(itemsOf(id,'P')).p)} g</span>`:'';
  if(!open)return `<button class="rcard" data-act="exp" data-id="${id}" aria-expanded="false" id="rec-${id}"><span class="r-ph">${ill(id)}${recBadge(id)}</span>
     <span class="r-tx"><span class="tag">${recTag(id)}</span><b>${m.n}</b><span class="sub">${m.t} min${prot?' · '+prot:''}</span></span></button>`;
  const r=RECIPES[id]||{steps:['Separe os itens do quadro e monte na proporção de cada um.'],tips:[]};
  const cols=isMeal?`<div class="cols">${['L','P'].map(w=>{const its=itemsOf(id,w),n=nut(its);return `<div class="col ${w}"><h4>${WHO[w]}</h4><ul>${its.map(it=>`<li>${fq(it[0],it[1])}</li>`).join('')}</ul><div class="tt">${R0(n.p)} g de proteína · ${R0(n.k)} kcal</div></div>`;}).join('')}</div>`:`<div class="note">${m.desc}</div>`;
  const steps=`<ol class="steps">${r.steps.map((x,i)=>{const k=`${id}|${i}`;return `<li class="${S.steps[k]?'done':''}" data-act="step" data-key="${k}"><span>${x}</span></li>`;}).join('')}</ol>`;
  const tt=(m.lote?['Prato de panela: faça em dobro. Quando ele aparece em duas refeições seguidas, o quadro já soma as duas e a segunda é só esquentar (até 3 dias na geladeira).']:[]).concat(r.tips);
  const tips=tt.length?`<div class="note">${tt.map(t=>`<div>${t}</div>`).join('')}</div>`:'';
  const c=isMeal?recCasa(id):null;
  const casa=c&&c.falta.length?`<button class="buy warn" data-act="golist">Falta em casa: ${c.falta.map(i=>SN[i]||ING[i].n).join(', ')}. Ponha no plano e entra na lista.</button>`:c&&c.all?'<div class="buy">Tem tudo em casa para fazer.</div>':'';
  return `<article class="rcard open" id="rec-${id}"><button class="r-hero" data-act="exp" data-id="${id}" aria-expanded="true" aria-label="Fechar ${esc(m.n)}">${ill(id)}${CHEV}</button>
   <div class="rec-b"><div><span class="tag">${recTag(id)}</span><h3>${m.n}</h3><div class="sub">${m.t} min${prot?` · proteína ${prot}`:''}${isMeal&&isCustom(id)?' · ajustada por vocês':''}</div></div>
