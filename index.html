<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cardápio Lucas e Pri</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cardápio">
<meta name="theme-color" content="#F0F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1612" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
/* Layout: coluna única de até 900px, placar fixo no topo da aba Hoje, navegação fixa embaixo (uso com uma mão, no celular, no mercado).
   Identidade: mercado + panela. Espinafre = ação concluída, cobalto = Lucas, framboesa = Pri. */
:root{
  --bg:#F0F4EF; --surface:#FFFFFF; --surface2:#E6EDE5; --ink:#14231B; --ink2:#4F6358; --line:#D2DED3;
  --leaf:#1E7B4E; --leaf-ink:#FFFFFF; --leaf-soft:#D9EEE2;
  --lucas:#2A55D6; --lucas-soft:#E1E8FB; --pri:#BC2B6A; --pri-soft:#F8DEEA;
  --warn:#9A5B07; --warn-soft:#FBEBCF; --ill:#E7EEE4;
  --f-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(20,35,27,.06),0 8px 24px rgba(20,35,27,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1612; --surface:#16211B; --surface2:#1E2C24; --ink:#E7F0E9; --ink2:#9CB1A3; --line:#2A3B31;
  --leaf:#4DC78C; --leaf-ink:#07140D; --leaf-soft:#1B3A2A;
  --lucas:#86A6FF; --lucas-soft:#1C2745; --pri:#F58AB8; --pri-soft:#3E1D2E;
  --warn:#F0B35A; --warn-soft:#3A2B10; --ill:#1C2A22; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1612; --surface:#16211B; --surface2:#1E2C24; --ink:#E7F0E9; --ink2:#9CB1A3; --line:#2A3B31;
  --leaf:#4DC78C; --leaf-ink:#07140D; --leaf-soft:#1B3A2A;
  --lucas:#86A6FF; --lucas-soft:#1C2745; --pri:#F58AB8; --pri-soft:#3E1D2E;
  --warn:#F0B35A; --warn-soft:#3A2B10; --ill:#1C2A22; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f-body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:env(safe-area-inset-top,0px) calc(96px + env(safe-area-inset-bottom,0px));font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:900px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 0 10px;flex-wrap:wrap}
.hdr h1{font-size:26px;line-height:1.05;font-weight:700}
.hdr p{margin:4px 0 0;color:var(--ink2);font-size:13px}
.who-legend{display:flex;gap:12px;font-size:12px;color:var(--ink2);flex-wrap:wrap;align-items:center}
.who-legend>span{white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:baseline}
.dot.L{background:var(--lucas)}.dot.P{background:var(--pri)}

/* navegação */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.nav-in{display:flex;width:100%;max-width:900px;gap:2px}
.nav button{flex:1;min-width:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;color:var(--ink2);font-size:11px;font-weight:500}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--leaf);background:var(--leaf-soft)}

/* componentes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.sub{color:var(--ink2);font-size:13px}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.today::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--leaf);margin-left:6px;vertical-align:middle}
.day-chip{display:flex;flex-direction:column;align-items:center;min-width:56px;padding:7px 10px;line-height:1.15;gap:1px}
.day-chip b{font-size:15px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:13px}
.btn.primary{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}
.btn.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.btn.small{padding:6px 10px;font-size:12px}
.link{border:0;background:none;color:var(--leaf);font-weight:600;padding:0;font-size:13px;text-decoration:underline;text-underline-offset:3px}

/* placar */
.score{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;box-shadow:var(--shadow);min-width:0}
.sc .nm{font-size:12px;font-weight:700;display:flex;align-items:center}
.sc .big{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.1}
.sc .big small{font-size:13px;font-weight:500;color:var(--ink2);font-family:var(--f-body)}
.bar{height:8px;border-radius:99px;background:var(--surface2);position:relative;overflow:hidden;margin:6px 0 4px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:99px;display:block}
.bar .plan{background:color-mix(in srgb,var(--c) 28%,transparent)}
.bar .done{background:var(--c)}
.bar.thin{height:5px;margin:3px 0 2px}
.sc.L{--c:var(--lucas)}.sc.P{--c:var(--pri)}
.sc .st{font-size:12px;color:var(--ink2)}
.sc .st.ok{color:var(--leaf);font-weight:700}
.tip{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:500}
.tip.ok{background:var(--leaf-soft);color:var(--leaf)}

/* cartão de refeição */
.slot{display:grid;grid-template-columns:104px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
.ill{background:var(--ill);border-radius:12px;aspect-ratio:3/2;align-self:start;overflow:hidden}
.ill svg{display:block;width:100%;height:100%}
.slot-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--leaf)}
.slot h3{font-size:17px;margin:2px 0 4px;line-height:1.2}
.people{grid-column:1/-1;display:flex;flex-direction:column;gap:8px}
.person{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start;padding:10px;border-radius:12px;border:1px solid transparent;cursor:pointer;min-height:48px}
.person.L{background:var(--lucas-soft)}.person.P{background:var(--pri-soft)}
.person input{position:absolute;opacity:0;pointer-events:none}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--ink2);display:grid;place-items:center;background:var(--surface);flex:0 0 auto;margin-top:1px}
.box svg{width:16px;height:16px;stroke:var(--leaf-ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
input:checked + .box{background:var(--leaf);border-color:var(--leaf)}
input:checked + .box svg{opacity:1}
input:focus-visible + .box{outline:2px solid var(--leaf);outline-offset:2px}
.person .who{font-weight:700;font-size:13px}
.person.L .who{color:var(--lucas)}.person.P .who{color:var(--pri)}
.person .desc{font-size:13px;color:var(--ink);grid-column:2}
.person .nums{font-size:12px;color:var(--ink2);text-align:right;white-space:nowrap}
.person.done .desc{opacity:.55;text-decoration:line-through}
.slot-actions{display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap}
.slot-actions .link{padding:6px 0}
.alts{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.alt{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;background:var(--surface2);border-radius:12px;padding:8px}
.alt .mini{width:56px;height:38px;border-radius:8px;overflow:hidden;background:var(--ill)}
.alt .mini svg{width:100%;height:100%;display:block}
.alt-tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.alt-tx b{font-size:14px;line-height:1.25}
.alt-tx .L{color:var(--lucas);white-space:nowrap}.alt-tx .P{color:var(--pri);white-space:nowrap}

/* extras */
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 6px 6px 12px;font-size:13px}
.pill b{font-weight:700}
.pill .pm{border:0;width:26px;height:26px;border-radius:50%;background:var(--surface2);font-weight:700;line-height:1}
.pill .pm.add{background:var(--leaf);color:var(--leaf-ink)}
.pill .ct{min-width:14px;text-align:center;font-weight:700}

/* semana */
.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.dayc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left;box-shadow:var(--shadow)}
.dayc .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dayc h3{font-size:18px}
.dayc ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.dayc li{display:flex;gap:8px;align-items:center;font-size:13px}
.dayc li .sl{width:62px;flex:0 0 auto;font-size:11px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.dayc li .mini{width:34px;height:22px;border-radius:6px;overflow:hidden;background:var(--ill);flex:0 0 auto}
.dayc li .mini svg{width:100%;height:100%;display:block}
.tots{display:flex;gap:6px;flex-wrap:wrap}
.tot{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px}
.tot.L{background:var(--lucas-soft);color:var(--lucas)}.tot.P{background:var(--pri-soft);color:var(--pri)}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--ink2);font:500 11px var(--f-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .goal{stroke:var(--ink2);stroke-width:1;stroke-dasharray:4 3}
.chart .bL{fill:var(--lucas)}.chart .bP{fill:var(--pri)}

/* compras */
.trips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trip{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.trip b{font-family:var(--f-display);font-size:16px}
.trip[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft);box-shadow:inset 0 0 0 1px var(--leaf)}
.trip .sub{font-size:12px}
.meter{height:10px;border-radius:99px;background:var(--surface2);position:relative;overflow:hidden;margin:8px 0 4px}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--leaf);border-radius:99px}
.meter.over i{background:var(--warn)}
.meter u{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.6}
.aisle h3{font-size:15px;margin:6px 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:start;padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer;min-height:54px}
.item:last-child{border-bottom:0}
.item input{position:absolute;opacity:0;pointer-events:none}
.item .nm{font-weight:600;font-size:15px}
.item .qt{font-weight:700;text-align:right;font-size:14px;white-space:nowrap}
.item .meta{grid-column:2/4;font-size:12px;color:var(--ink2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item.done .nm,.item.done .qt{text-decoration:line-through;opacity:.5}
.mini-tag{font-size:10px;font-weight:700;border-radius:6px;padding:1px 6px}
.mini-tag.L{background:var(--lucas-soft);color:var(--lucas)}.mini-tag.P{background:var(--pri-soft);color:var(--pri)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stock{display:flex;gap:16px;flex-wrap:wrap}
.stepper{display:inline-flex;align-items:center;gap:8px}
.stepper button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);font-weight:700}
.stepper span{min-width:20px;text-align:center;font-weight:700}

/* receitas */
.rec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.rec-h{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:center;width:100%;border:0;background:none;padding:12px;text-align:left}
.rec-h h3{font-size:17px;line-height:1.2;margin:2px 0}
.rec-h .chev{width:20px;height:20px;stroke:var(--ink2);fill:none;stroke-width:2;transition:transform .15s}
.rec-h[aria-expanded="true"] .chev{transform:rotate(180deg)}
.rec-b{padding:0 14px 14px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.col{border-radius:12px;padding:10px 12px}
.col.L{background:var(--lucas-soft)}.col.P{background:var(--pri-soft)}
.col h4{margin:0 0 6px;font:700 13px var(--f-display)}
.col.L h4{color:var(--lucas)}.col.P h4{color:var(--pri)}
.col ul{margin:0;padding-left:16px;font-size:13px}
.col .tt{margin-top:8px;font-size:12px;font-weight:700}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:s}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;padding:8px 10px;border-radius:10px;background:var(--surface2);cursor:pointer;counter-increment:s}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:13px}
.steps li.done{opacity:.5}.steps li.done span{text-decoration:line-through}
.steps li.done::before{background:var(--leaf);color:var(--leaf-ink)}
.note{background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:13px}
.note b{font-weight:700}
.where{font-size:12px;color:var(--ink2)}

/* preparo */
.task{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;padding:12px;border-bottom:1px solid var(--line);cursor:pointer}
.task:last-child{border-bottom:0}
.task input{position:absolute;opacity:0;pointer-events:none}
.task .nm{font-weight:700}
.task .tx{grid-column:2/4;font-size:13px;color:var(--ink2)}
.task.done .nm{text-decoration:line-through;opacity:.5}
.task .mn{font-size:12px;color:var(--ink2);white-space:nowrap}

/* ajustes */
.fld{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.fld:last-child{border-bottom:0}
.fld label{font-size:14px}
.fld small{display:block;color:var(--ink2);font-size:12px}
input[type=number]{width:100%;font:inherit;font-size:16px;font-weight:700;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);text-align:right}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
.ok-t{color:var(--leaf);font-weight:600}.no-t{color:var(--pri);font-weight:600}
.scroll-x{overflow-x:auto}

@media (max-width:560px){
  .slot{grid-template-columns:88px 1fr}
  .rec-h{grid-template-columns:78px 1fr auto}
  .cols{grid-template-columns:1fr}
  .hdr h1{font-size:23px}
  .trips{gap:6px}.trip{padding:8px}
}
/* Desktop e tablet: Lucas e Pri lado a lado, alternativas em duas colunas */
@media (min-width:760px){
  .people{display:grid;grid-template-columns:1fr 1fr}
  .alts{display:grid;grid-template-columns:1fr 1fr}
  .alts .eyebrow{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<div id="app"></div>
<script>
/* ===== DADOS: ingredientes, refeições, semana ===== */
const AISLES = {
  hort:'Hortifruti', prot:'Peixe, frango e enlatados', lat:'Ovos e laticínios',
  merc:'Mercearia', desp:'Despensa (confira em casa)'
};
// p = g de proteína por unidade, k = kcal por unidade, f = fator receita->compra,
// pack = tamanho da embalagem (unidade de compra), wp = g por unidade de compra
// MEALS: slot = tipo (cafe, ref = almoço ou jantar, lanche, ceia); oc = os ovos da refeição são cozidos no lote.
// Toda refeição do mesmo tipo é alternativa das outras na aba Hoje (botão Trocar).
const ING = {
  ovo:      {n:'Ovo', u:'un', p:6.2, k:75, pack:12, pk:['dúzia','dúzias'], wp:60, aisle:'lat'},
  atum:     {n:'Atum em lata (natural)', u:'lata', p:27, k:125, pack:1, pk:['lata','latas'], wp:170, aisle:'prot'},
  sardinha: {n:'Sardinha em lata', u:'lata', p:22, k:190, pack:1, pk:['lata','latas'], wp:125, aisle:'prot'},
  peixe:    {n:'Filé de peixe congelado (tilápia ou merluza)', u:'g', p:.20, k:.98, pack:500, pk:['pacote','pacotes'], size:'500 g', aisle:'prot'},
  frango:   {n:'Peito de frango', u:'g', p:.23, k:1.1, pack:500, pk:['bandeja','bandejas'], size:'500 g', aisle:'prot'},
  mussarela:{n:'Mussarela fatiada', u:'g', p:.22, k:2.8, pack:150, pk:['pacote','pacotes'], size:'150 g', aisle:'lat'},
  parmesao: {n:'Parmesão ralado', u:'g', p:.36, k:4, pack:50, pk:['pacote','pacotes'], size:'50 g', aisle:'lat'},
  iogurte:  {n:'Iogurte natural desnatado sem lactose (Pense Zero)', u:'g', p:.036, k:.4, pack:1150, pk:['garrafa','garrafas'], size:'1,15 kg', aisle:'lat'},
  leite:    {n:'Leite sem lactose', u:'ml', p:.032, k:.62, pack:1000, pk:['caixa','caixas'], size:'1 L', wp:1.03, aisle:'lat'},
  whey:     {n:'Whey isolado', u:'dose', p:24, k:115, pack:33, pk:['pote','potes'], size:'1 kg', aisle:'desp', pantry:true},
  azeite:   {n:'Azeite de oliva', u:'cs', p:0, k:120, pack:1, pk:['garrafa','garrafas'], aisle:'desp', pantry:true, mlPerUnit:15},

const KEY='cardapio-lucas-pri-v1';
const DEF={checks:{},extras:{},shop:{},stock:{atum:4,sardinha:2},pantry:{},prep:{},steps:{},
  targets:{L:{p:160,k:2800},P:{p:125,k:1750}},ref:{iog:3.6,whey:24},maxKg:14,have:{},swap:{}};
function clone(o){return JSON.parse(JSON.stringify(o));}
function loadState(){
  const s=clone(DEF);
  try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);
    for(const k of Object.keys(DEF)){if(o[k]!==undefined){
      if(DEF[k]&&typeof DEF[k]==='object'&&!Array.isArray(DEF[k])){
        if(k==='targets'){for(const w of ['L','P'])s.targets[w]=Object.assign({},DEF.targets[w],(o.targets||{})[w]);}
        else s[k]=Object.assign({},DEF[k],o[k]);
      } else s[k]=o[k];}}}}catch(e){}
  return s;
}
let S=loadState();
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}},150);}

function fmt(n,d){return Number(n).toLocaleString('pt-BR',{maximumFractionDigits:d==null?1:d});}
const R0=n=>Math.round(n);
function fq(id,q){
  switch(id){
    case 'ovo': return `${fmt(q)} ${q===1?'ovo':'ovos'}`;
    case 'atum': case 'sardinha': return q===.5?`½ lata de ${SN[id]}`:`${fmt(q)} ${q===1?'lata':'latas'} de ${SN[id]}`;
    case 'whey': return `${fmt(q)} dose de whey`;
    case 'azeite': return `${q===.25?'¼':q===.5?'½':fmt(q)} col. sopa de azeite`;
    case 'banana': return `${fmt(q)} banana${q>1?'s':''}`;
    case 'limao': return `${q===.5?'½':fmt(q)} limão`;
    case 'pao': return `${fmt(q)} ${q===1?'fatia':'fatias'} de pão`;
    default: return `${fmt(q)} ${ING[id].u==='ml'?'ml':'g'} de ${SN[id]}`;
  }
}
function pOf(id){
  if(id==='iogurte') return S.ref.iog/100;
  if(id==='whey') return S.ref.whey;
  return ING[id].p;
}
function nut(items){let p=0,k=0;for(const it of items){p+=pOf(it[0])*it[1];k+=ING[it[0]].k*it[1];}return{p,k};}
const EXTRAS=[
  {id:'whey',n:'1 dose de whey',it:[['whey',1]]},
  {id:'atum',n:'1 lata de atum',it:[['atum',1]]},
  {id:'iogurte',n:'1 copo de iogurte (200 g)',it:[['iogurte',200]]},
  {id:'ovo',n:'1 ovo cozido',it:[['ovo',1]]},
  {id:'leite',n:'1 copo de leite (200 ml)',it:[['leite',200]]},

  {id:'amendoim',n:'1 colher de pasta de amendoim (15 g)',it:[['amendoim',15]]}
];
/* Refeições do dia com as trocas feitas na aba Hoje. Tudo que é calculado (placar, compras, preparo) passa por aqui. */
const KIND={cafe:'cafe',almoco:'ref',jantar:'ref',lanche:'lanche',ceia:'ceia'};
function slotsOf(day){
  const out={};
  for(const k in day.slots){const sw=S.swap[`${day.d}|${k}`];out[k]=sw&&MEALS[sw]&&MEALS[sw].slot===KIND[k]?sw:day.slots[k];}
  return out;
}
function dayStats(day,who){
  const plan={p:0,k:0},done={p:0,k:0};
  const sl=slotsOf(day);for(const s of SLOTS){const mid=sl[s[0]];if(!mid)continue;const n=nut(MEALS[mid][who]);plan.p+=n.p;plan.k+=n.k;
    if(S.checks[`${day.d}|${s[0]}|${who}`]){done.p+=n.p;done.k+=n.k;}}
  const ex=S.extras[`${day.d}|${who}`]||{};const xt={p:0,k:0};
  for(const e of EXTRAS){const c=ex[e.id]||0;if(c){const n=nut(e.it);xt.p+=n.p*c;xt.k+=n.k*c;}}
  return{plan,done:{p:done.p+xt.p,k:done.k+xt.k},projected:{p:plan.p+xt.p,k:plan.k+xt.k},extra:xt};
}
function suggest(gap){
  if(gap<=3)return '';
  const pw=nut([['whey',1]]).p,py=nut([['iogurte',200]]).p,po=nut([['ovo',1]]).p;
  const c={w:0,y:0,o:0};let g=gap;
  while(g>2&&c.w+c.y+c.o<6){if(g>=pw*.8){c.w++;g-=pw;}else if(g>=py*.8){c.y++;g-=py;}else{c.o++;g-=po;}}
  const out=[];
  if(c.w)out.push(`${c.w} ${c.w>1?'doses':'dose'} de whey`);
  if(c.y)out.push(`${c.y} ${c.y>1?'copos':'copo'} de iogurte`);
  if(c.o)out.push(`${c.o} ${c.o>1?'ovos cozidos':'ovo cozido'}`);
  return out.join(' + ');
}

const BATCH1=['2026-11-15','2026-11-16','2026-11-17','2026-11-18'],BATCH2=['2026-11-19','2026-11-20','2026-11-21','2026-11-22'];
const ALL_DAYS=WEEK.map(d=>d.d);
function needs(days,onlyMeals){
  const out={};
  for(const dd of days){const day=WEEK.find(x=>x.d===dd);if(!day)continue;const sl=slotsOf(day);
    for(const s of SLOTS){const mid=sl[s[0]];if(!mid)continue;
      for(const who of ['L','P']){for(const it of MEALS[mid][who]){
        const o=out[it[0]]||(out[it[0]]={tot:0,L:0,P:0,uses:[]});
        o.tot+=it[1];o[who]+=it[1];const sh=SHORT[mid];if(!o.uses.includes(sh))o.uses.push(sh);}}}}
  return out;
}
function buyText(it){
  const g=ING[it.id];
  if(g.loose){if(g.u==='un')return `${it.qty} un`;return it.qty>=1000?`${fmt(it.qty/1000,2)} kg`:`${it.qty} g`;}
  const n=it.packs;return `${n} ${n===1?g.pk[0]:g.pk[1]}${g.size?' de '+g.size:''}`;
}
function needText(id,q){
  const u=ING[id].u;
  if(u==='un')return `${fmt(q)} un`;if(u==='fatia')return `${fmt(q)} ${q===1?'fatia':'fatias'}`;if(u==='lata')return `${fmt(q)} ${q===1?'lata':'latas'}`;
  if(u==='ml')return `${fmt(q,0)} ml`;if(u==='g cozido')return `${fmt(q,0)} g cozido`;return `${fmt(q,0)} g`;
}
const PANTRY_STATIC=[
  {id:'sal',n:'Sal'},{id:'pimenta',n:'Pimenta-do-reino'},{id:'paprica',n:'Páprica'},
  {id:'oregano',n:'Orégano'},{id:'alho',n:'Alho (1 cabeça, só para o azeite aromatizado)'}];
function shopping(){
  const left={};
  for(const id in S.stock){if(ING[id])left[id]=(S.stock[id]||0)*(ING[id].f||1);}
  return TRIPS.map(t=>{
    const nd=needs(t.days);const items=[];let w=0;
    for(const id of ['frango','arroz','feijao'])delete nd[id];
    const bn=needs(t.id==='T1'?BATCH1:t.id==='T2'?BATCH2:[]);
    for(const id of ['frango','arroz'])if(bn[id])nd[id]=bn[id];
    if(t.id==='T1'){const fa=needs(ALL_DAYS).feijao;if(fa)nd.feijao=fa;}
    for(const id in nd){const g=ING[id];if(g.pantry)continue;
      const need=nd[id].tot*(g.f||1);const have=S.have[id]?Infinity:(left[id]||0);let packs=0;
      if(have<need-1e-9)packs=Math.ceil((need-have)/g.pack-1e-9);
      left[id]=isFinite(have)?have+packs*g.pack-need:0;
      if(packs>0){const qty=packs*g.pack;const wt=qty*(g.wp||1);w+=wt;
        items.push({id,packs,qty,need:nd[id].tot,who:{L:nd[id].L>0,P:nd[id].P>0},uses:nd[id].uses,wt});}
      else if(nd[id].tot>0){/* coberto pelo estoque ou por sobra da compra anterior */}
    }
    items.sort((a,b)=>ING[a.id].n.localeCompare(ING[b.id].n,'pt-BR'));
    return Object.assign({},t,{items,kg:w/1000});
  });
}

function scoreCard(day,who){

  return `<div class="sc ${who}"><div class="nm"><span class="dot ${who}"></span>${WHO[who]}</div>
   <div class="big">${R0(st.done.p)}<small> / ${t.p} g</small></div>
   <div class="bar" role="img" aria-label="Proteína ${R0(st.done.p)} de ${t.p} gramas"><i class="plan" style="width:${pp}%"></i><i class="done" style="width:${dp}%"></i></div>

function advice(day){
  if(!day.slots.cafe||!day.slots.jantar)return '';
  const out=[];
  for(const w of ['L','P']){
    const st=dayStats(day,w),t=S.targets[w];const gap=t.p-st.projected.p;
    if(gap>5){const s=suggest(gap);out.push(`<b>${WHO[w]}:</b> o plano chega a ~${R0(st.projected.p)} g. Para fechar os ${t.p} g, adicione ${s}.`);}
  }
  if(!out.length)return `<div class="tip ok">O plano do dia fecha a meta dos dois. Se um dia escapar, sem drama: vale a média da semana.</div>`;
  return `<div class="tip">${out.join('<br>')}</div>`;
}

function chartSvg(){
  const W=440,H=210,L=34,Rr=6,T=18,B=40,iw=W-L-Rr,ih=H-T-B,n=WEEK.length,slot=iw/n,bw=Math.min(18,slot/2-3);

  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Proteína planejada por dia, em porcentagem da meta de cada um">`;
  for(const v of [0,50,100]){s+=`<line class="${v===100?'goal':'grid'}" x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}%</text>`;}
  WEEK.forEach((d,i)=>{
    const cx=L+slot*i+slot/2;
    for(const e of [['L',-bw-1],['P',1]]){
      const w=e[0],dx=e[1];
      const pc=dayStats(d,w).plan.p/S.targets[w].p*100;const yy=y(pc);
      s+=`<rect class="b${w}" x="${cx+dx}" y="${yy}" width="${bw}" height="${Math.max(0,y(0)-yy)}" rx="3"/><text x="${cx+dx+bw/2}" y="${yy-4}" text-anchor="middle">${R0(pc)}</text>`;}
    s+=`<text x="${cx}" y="${H-22}" text-anchor="middle">${d.wd} ${d.d.slice(8)}</text>`;
    if(!d.slots.cafe||!d.slots.jantar)s+=`<text x="${cx}" y="${H-9}" text-anchor="middle">parcial</text>`;
  });
  return s+'</svg>';
}

  const head=`<button class="rec-h" data-act="exp" data-id="${id}" aria-expanded="${open}" id="rec-${id}"><div class="ill">${ill(id)}</div>
   <div><span class="tag">${isMeal?(m.slot==='cafe'?'Café':m.slot==='ref'?'Almoço ou jantar':m.slot==='lanche'?'Lanche':'Ceia'):'Preparo base'}</span><h3>${m.n}</h3>
   <div class="sub">${m.t} min${isMeal?` · Lucas ${R0(nut(m.L).p)} g · Pri ${R0(nut(m.P).p)} g de proteína`:''}</div></div>${CHEV}</button>`;
  let body='';
  if(open){
    const cols=isMeal?`<div class="cols">${['L','P'].map(w=>{const n=nut(m[w]);return `<div class="col ${w}"><h4>${WHO[w]}</h4><ul>${m[w].map(it=>`<li>${fq(it[0],it[1])}</li>`).join('')}</ul><div class="tt">${R0(n.p)} g de proteína · ${R0(n.k)} kcal</div></div>`;}).join('')}</div>`:`<div class="note" style="margin-top:14px">${m.desc}</div>`;
    const steps=`<ol class="steps">${r.steps.map((s,i)=>{const k=`${id}|${i}`;return `<li class="${S.steps[k]?'done':''}" data-act="step" data-key="${k}"><span>${s}</span></li>`;}).join('')}</ol>`;
    const tips=r.tips.length?`<div class="note">${r.tips.map(t=>`<div>${t}</div>`).join('')}</div>`:'';
    const wh=isMeal?`<div class="where">Na semana: ${whereUsed(id)}</div>`:'';
    body=`<div class="rec-b">${cols}${steps}${tips}${wh}<div><button class="link" data-act="clearsteps" data-id="${id}">Limpar passos marcados</button></div></div>`;
  }
  return `<article class="rec">${head}${body}</article>`;
}
function viewReceitas(){
  const F=[['all','Todas'],['cafe','Café'],['ref','Almoço e jantar'],['lc','Lanche e ceia'],['base','Base']];
  const chips=F.map(f=>`<button class="chip" data-act="filter" data-f="${f[0]}" aria-pressed="${V.filter===f[0]}">${f[1]}</button>`).join('');
  const ids=Object.keys(MEALS).concat(Object.keys(BASES)).filter(id=>{
    const sl=(MEALS[id]||BASES[id]).slot;
    return V.filter==='all'||(V.filter==='lc'?(sl==='lanche'||sl==='ceia'):sl===V.filter);});
  return `<div class="chips">${chips}</div><div class="stack">${ids.map(recCard).join('')}</div>`;
}

/* ----- PREPARO ----- */
function ceilTo(n,s){return Math.ceil(n/s-1e-9)*s;}
function eggOf(list){const f=list.find(i=>i[0]==='ovo');return f?f[1]:0;}
function boiledEggs(days){let n=0;days.forEach(dd=>{const d=dayOf(dd);if(!d)return;Object.values(slotsOf(d)).forEach(mid=>{
  const m=MEALS[mid];if(m.oc)n+=eggOf(m.L)+eggOf(m.P);});});return n;}
function prepPlan(){
  const w1=['2026-11-16','2026-11-17','2026-11-18'],w2=['2026-11-19','2026-11-20','2026-11-21','2026-11-22'];
  const mk=(key,label,when,days,first)=>{
    const nd=needs(days);const fr=ceilTo(((nd.frango||{}).tot||0)*1.1,50);
    const ar=nd.arroz?ceilTo(nd.arroz.tot*.34*1.1,10):0;
    const feijAll=needs(ALL_DAYS).feijao;const fj=feijAll?ceilTo(feijAll.tot*.35*1.05,10):0;
    const ov=boiledEggs(days);
    const tasks=[
      {id:`${key}-azeite`,n:'Azeite aromatizado',m:8,t:'100 ml de azeite com 2 dentes de alho amassados, fogo baixo por 5 min. Tire todo o alho. Geladeira, até 4 dias.'+(first?'':' Descarte o do domingo e faça este novo.')},
      {id:`${key}-frango`,n:`Frango assado: ${fr} g`,m:30,t:`Tempere com sal, páprica e limão. Forno a 200 °C por 22 a 25 min. Desfie metade e fatie o resto. Cobre ${first?'segunda a quarta':'quinta a domingo'}.`},
      {id:`${key}-ovos`,n:`Ovos cozidos: ${ov} un`,m:12,t:'Água fria, ferva e conte 10 min. Passe em água gelada. A conta inclui as trocas feitas na aba Hoje.'},
      {id:`${key}-arroz`,n:`Arroz: ${ar} g crus`,m:20,t:`Refogue no azeite, 2,5 partes de água, 12 min tampado. Rende ~${ar*3} g cozidos. Só o Lucas come arroz.`}];
    if(first)tasks.push({id:`${key}-feijao`,n:`Feijão: ${fj} g secos`,m:35,t:`Pressão por 25 min. Rende ~${Math.round(fj*2.85/10)*10} g cozidos. Congele em porções de 150 g, uma por omelete da semana.`});
    else tasks.push({id:`${key}-feijao`,n:'Feijão: tirar 1 porção do congelador',m:2,t:'Passe uma porção de 150 g para a geladeira na véspera do omelete.'});
    return{key,label,when,total:tasks.reduce((a,t)=>a+t.m,0),tasks};};
  return [mk('dom','Domingo 15','~1h15',w1,true),mk('qua','Quarta 18','~1h',w2,false)];
}
function viewPreparo(){
  const plans=prepPlan();
  return `<div class="stack"><div class="sub">Dois blocos de cozinha por semana. O resto do tempo é montar o prato. As quantidades saem do plano da semana.</div>
  ${plans.map(p=>{const done=p.tasks.filter(t=>S.prep[t.id]).length;
   return `<section class="stack"><div class="row" style="justify-content:space-between;flex-wrap:wrap"><h2 style="font-size:20px">${p.label}</h2><span class="sub">${done}/${p.tasks.length} feitos · panelas e forno ao mesmo tempo, ${p.when}</span></div>
   <div class="list">${p.tasks.map(t=>{const on=!!S.prep[t.id];
    return `<label class="task${on?' done':''}"><input type="checkbox" data-act="prep" data-key="${t.id}"${on?' checked':''}><span class="box">${CHECK}</span><span class="nm">${t.n}</span><span class="mn">${t.m} min</span><span class="tx">${t.t}</span></label>`;}).join('')}</div></section>`;}).join('')}
  <div><button class="link" data-act="recipe" data-id="B4">Ver receita do azeite aromatizado</button></div></div>`;
}

/* ----- AJUSTES ----- */
function numFld(label,hint,path,val,step){return `<div class="fld"><label for="n-${path}">${label}${hint?`<small>${hint}</small>`:''}</label><input id="n-${path}" type="number" inputmode="decimal" step="${step||1}" min="0" value="${val}" data-act="num" data-path="${path}"></div>`;}
function viewAjustes(){
  const conf=V.confirm==='all';
  return `<div class="stack">
  <section class="card"><div class="eyebrow">Metas diárias</div>
   ${numFld('Lucas: proteína (g)','Janela de 155 a 165 g','t.L.p',S.targets.L.p)}${numFld('Lucas: energia (kcal)','Superávit leve','t.L.k',S.targets.L.k,50)}
   ${numFld('Pri: proteína (g)','~1,9 g por kg, com 66 kg','t.P.p',S.targets.P.p)}${numFld('Pri: energia (kcal)','Déficit leve','t.P.k',S.targets.P.k,50)}</section>
  <section class="card"><div class="eyebrow">Valores de referência</div>
   ${numFld('Proteína em 100 g do iogurte (g)','Pense Zero natural: ~3,6 g. Se comprar grego, ~5 a 6 g. Muda todos os totais.','r.iog',S.ref.iog,.1)}
   ${numFld('Proteína de 1 dose de whey (g)','A sua referência: 24 g','r.whey',S.ref.whey,.5)}
   ${numFld('Limite da mochila (kg)','Alerta nas compras','maxkg',S.maxKg,.5)}</section>
  <section class="card stack"><div class="eyebrow">Como as contas são feitas</div>
   <div class="note">Os totais são estimativas com valores médios de tabela (TACO e rótulos). A balança, na média da semana, é o ajuste real.</div>
   <div class="note"><b>Feijão:</b> a referência de 12 a 15 g por concha parece alta. Feijão cozido tem cerca de 5 g de proteína por 100 g, então uma concha (~140 g) rende ~7 g. Usei 5 g por 100 g. Se pesar e achar outro valor, é só avisar.</div></section>
  <section class="card stack"><div class="eyebrow">Pri: o que pode e o que evitar (FODMAP)</div>
   <div class="scroll-x"><table class="t"><thead><tr><th>Pode</th><th>Evitar</th></tr></thead><tbody>
    <tr><td class="ok-t">Frango, ovo, peixe, atum, sardinha</td><td class="no-t">Feijão, lentilha, grão-de-bico, soja</td></tr>
    <tr><td class="ok-t">Leite e iogurte sem lactose, mussarela, parmesão</td><td class="no-t">Leite comum, cottage, ricota, requeijão</td></tr>
    <tr><td class="ok-t">Batata, arroz, tapioca, aveia (até 40 g), macarrão de arroz, pão de trigo até 1 fatia (½ pão francês) por vez</td><td class="no-t">Pão e macarrão de trigo em quantidade</td></tr>
    <tr><td class="ok-t">Cenoura, abobrinha, tomate, pepino, espinafre</td><td class="no-t">Cebola, alho, cogumelo, couve-flor, beterraba</td></tr>
    <tr><td class="ok-t">Morango, uva, mamão, banana firme, laranja</td><td class="no-t">Manga, maçã, pera, abacate, banana muito madura</td></tr></tbody></table></div>
   <div class="sub">Tolerância varia de pessoa para pessoa e por porção. Se a Pri acompanha com nutricionista, vale alinhar esta lista com ela.</div></section>
  <section class="card stack"><div class="eyebrow">Dados</div><div class="sub">As marcações ficam salvas só neste aparelho e navegador. Quem abrir em outro celular começa do zero.</div>
   <div><button class="btn${conf?' warn':''}" data-act="resetall">${conf?'Toque de novo para zerar tudo':'Zerar todas as marcações'}</button></div></section></div>`;
}

/* ----- ROTEAMENTO E EVENTOS ----- */
const VIEWS={hoje:viewHoje,semana:viewSemana,compras:viewCompras,receitas:viewReceitas,preparo:viewPreparo,ajustes:viewAjustes};
function navHtml(){return `<div class="nav-in">${NAV.map(n=>`<button data-act="nav" data-v="${n[0]}"${V.view===n[0]?' aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${n[2]}</svg><span>${n[1]}</span></button>`).join('')}</div>`;}
function render(keep){
  const y=window.scrollY;
  $('#main').innerHTML=VIEWS[V.view]();
  $('#nav').innerHTML=navHtml();
  if(keep)window.scrollTo(0,y);
}
function go(v){if(!VIEWS[v])v='hoje';V.view=v;V.confirm=null;render(false);window.scrollTo(0,0);}
function setHash(v){try{if(location.hash.slice(1)===v){go(v);}else{location.hash=v;}}catch(e){go(v);}}
let cT=null;
function arm(k){V.confirm=k;clearTimeout(cT);cT=setTimeout(()=>{V.confirm=null;render(true);},4000);}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act;
  if(['chk','shop','pantry','prep','num'].indexOf(a)>=0)return;
  switch(a){
    case 'nav':setHash(t.dataset.v);return;
    case 'day':V.day=t.dataset.day;render(true);return;
    case 'day-go':V.day=t.dataset.day;setHash('hoje');return;
    case 'both':{const k=t.dataset;const a1=`${k.day}|${k.slot}|L`,a2=`${k.day}|${k.slot}|P`;const on=!(S.checks[a1]&&S.checks[a2]);S.checks[a1]=on;S.checks[a2]=on;save();render(true);return;}
    case 'recipe':V.open[t.dataset.id]=true;V.filter='all';setHash('receitas');setTimeout(()=>{const el=document.getElementById('rec-'+t.dataset.id);if(el)el.scrollIntoView({block:'start'});},60);return;
    case 'exwho':V.extraWho=t.dataset.who;render(true);return;
    case 'exadd':case 'exdel':{const key=`${V.day}|${V.extraWho}`;const ex=S.extras[key]=S.extras[key]||{};const id=t.dataset.id;ex[id]=Math.max(0,(ex[id]||0)+(a==='exadd'?1:-1));save();render(true);return;}
    case 'have':S.have[t.dataset.id]=!S.have[t.dataset.id];save();render(true);return;
    case 'trip':V.trip=t.dataset.id;V.confirm=null;render(true);return;
    case 'stock':{const id=t.dataset.id;S.stock[id]=Math.max(0,(S.stock[id]||0)+Number(t.dataset.d));save();render(true);return;}
    case 'resetshop':{const k='shop:'+t.dataset.id;if(V.confirm===k){Object.keys(S.shop).forEach(x=>{if(x.indexOf(t.dataset.id+'|')===0)delete S.shop[x];});V.confirm=null;save();}else arm(k);render(true);return;}
    case 'resetall':{if(V.confirm==='all'){S.checks={};S.extras={};S.shop={};S.pantry={};S.prep={};S.steps={};S.have={};S.swap={};V.confirm=null;save();}else arm('all');render(true);return;}
    case 'exp':V.open[t.dataset.id]=!V.open[t.dataset.id];render(true);return;
    case 'step':S.steps[t.dataset.key]=!S.steps[t.dataset.key];save();render(true);return;
    case 'clearsteps':Object.keys(S.steps).forEach(x=>{if(x.indexOf(t.dataset.id+'|')===0)delete S.steps[x];});save();render(true);return;
    case 'filter':V.filter=t.dataset.f;render(true);return;
    case 'swapopen':V.swap=V.swap===t.dataset.key?null:t.dataset.key;render(true);return;
    case 'swap':{const k=t.dataset.key,id=t.dataset.id,d=dayOf(k.split('|')[0]);
      if(id===d.slots[k.split('|')[1]])delete S.swap[k];else S.swap[k]=id;
      delete S.checks[k+'|L'];delete S.checks[k+'|P'];V.swap=null;save();render(true);return;}
  }
});
document.addEventListener('change',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
  if(a==='chk'){S.checks[t.dataset.key]=t.checked;save();render(true);}
  else if(a==='shop'){S.shop[t.dataset.key]=t.checked;save();render(true);}
  else if(a==='pantry'){S.pantry[t.dataset.key]=t.checked;save();render(true);}
  else if(a==='prep'){S.prep[t.dataset.key]=t.checked;save();render(true);}
  else if(a==='num'){const v=Number(t.value);if(!isFinite(v)||v<0)return;const p=t.dataset.path.split('.');
    if(p[0]==='t')S.targets[p[1]][p[2]]=v;else if(p[0]==='r')S.ref[p[1]]=v;else if(p[0]==='maxkg')S.maxKg=v;save();render(true);}
});
window.addEventListener('hashchange',()=>go(location.hash.slice(1)));
(function init(){
  document.getElementById('app').innerHTML=`<div class="wrap"><header class="hdr"><div><h1>Cardápio Lucas e Pri</h1><p>Semana de domingo 15 a domingo 22 de novembro</p></div>
   <div class="who-legend"><span><span class="dot L"></span>Lucas</span><span><span class="dot P"></span>Pri</span></div></header><main id="main"></main></div><nav class="nav" id="nav" aria-label="Seções"></nav>`;
  const h=(location.hash||'').slice(1);V.view=VIEWS[h]?h:'hoje';render(false);
})();

if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
